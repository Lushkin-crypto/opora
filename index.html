<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ОПОРА — личный помощник</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2314171c'/%3E%3Ccircle cx='32' cy='32' r='14' fill='none' stroke='%236ee0d0' stroke-width='4'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #14171c;
      --card: #1e232c;
      --card-2: #262c37;
      --line: rgba(255, 255, 255, 0.08);
      --text: #eef2f6;
      --muted: #b4bdcc;
      --faint: #8e98a8;
      --blue: #9ec4ff;
      --blue-deep: #5b8def;
      --teal: #6ee0d0;
      --teal-deep: #3ecfb8;
      --violet: #c4b0ff;
      --violet-deep: #8b74f5;
      --amber: #e7c27a;
      --rose: #f0c1c1;
      --ink: #071018;
      --radius: 24px;
      --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 18px 40px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }
    html { color-scheme: dark; scroll-padding-bottom: 200px; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      line-height: 1.45;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(880px 480px at 8% -10%, rgba(91, 141, 239, 0.28), transparent 58%),
        radial-gradient(640px 420px at 100% 0%, rgba(62, 207, 184, 0.18), transparent 52%),
        radial-gradient(520px 380px at 80% 110%, rgba(139, 116, 245, 0.16), transparent 50%),
        var(--bg);
      z-index: -1;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, .section-card:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
    }
    ::selection { background: rgba(110, 224, 208, 0.28); }
    h1, h2, .section-name, .brand, .greet {
      margin: 0;
      font-family: Unbounded, Manrope, "Segoe UI", system-ui, sans-serif;
    }
    p { margin: 0; }
    ul { list-style: none; margin: 0; padding: 0; }

    .shell {
      width: min(1040px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 260px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      letter-spacing: 0.16em;
      font-size: 13px;
      font-weight: 700;
    }
    .mark {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: #042824;
      background: linear-gradient(160deg, #7af0e4, #8eb7ff 55%, #c4b0ff);
      letter-spacing: 0;
      font-size: 16px;
    }
    .quiet { color: var(--faint); letter-spacing: 0; font-weight: 500; font-size: 14px; }
    .hello { margin: 0 0 28px; }
    .hello h1 {
      font-size: clamp(28px, 4.6vw, 46px);
      line-height: 1.16;
      letter-spacing: -0.03em;
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .greet { animation: greet-in 0.8s ease both; }
    .motive {
      margin-top: 10px;
      max-width: 36ch;
      color: #d5e4ff;
      font-size: 17px;
      animation: greet-in 0.9s ease 0.12s both;
    }
    .date-line { margin-top: 8px; color: var(--muted); font-size: 16px; }
    .date-line-tight { margin-top: 4px; font-size: 14px; color: var(--blue); }

    .card {
      background:
        linear-gradient(180deg, rgba(158, 196, 255, 0.08), rgba(196, 176, 255, 0.04) 42%, rgba(255, 255, 255, 0.02));
      background-color: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
    }
    .focus {
      position: relative;
      overflow: hidden;
      margin-bottom: 16px;
      padding: 26px;
      background:
        radial-gradient(480px 200px at 100% 0%, rgba(110, 224, 208, 0.24), transparent 62%),
        radial-gradient(360px 220px at 0% 100%, rgba(139, 116, 245, 0.2), transparent 58%),
        linear-gradient(180deg, #243044, #1b2130);
    }
    .kicker {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--teal);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .kicker i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(180deg, var(--teal), var(--violet));
      box-shadow: 0 0 10px rgba(196, 176, 255, 0.75);
      display: block;
    }
    .focus h2 {
      margin: 14px 0 8px;
      max-width: 16em;
      font-size: clamp(28px, 3vw, 40px);
      line-height: 1.15;
      letter-spacing: -0.03em;
      font-weight: 650;
    }
    .lead { color: var(--muted); max-width: 46ch; }
    .focus-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-top: 22px;
    }
    .meta { color: var(--muted); font-size: 15px; }

    .sections {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin: 16px 0 18px;
    }
    .section-card {
      position: relative;
      overflow: hidden;
      text-align: left;
      min-height: 158px;
      padding: 18px 78px 18px 18px;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #f4f7ff;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
    }
    .section-card:hover { transform: translateY(-4px) scale(1.02); }
    .section-card:active { transform: scale(0.98); }
    .tone-tasks { background: linear-gradient(155deg, #3d7dff 0%, #2450b8 42%, #1a2d55 100%); }
    .tone-health { background: linear-gradient(155deg, #1ec9c0 0%, #0e8f93 46%, #143a44 100%); }
    .tone-finance { background: linear-gradient(155deg, #8d74ff 0%, #5b46d6 48%, #2a2152 100%); }
    .tone-goals { background: linear-gradient(155deg, #59b7ff 0%, #6d6bff 50%, #2a2458 100%); }
    .tone-documents { background: linear-gradient(155deg, #4aa2ff 0%, #2f6fe0 46%, #1a3058 100%); }
    .tone-family { background: linear-gradient(155deg, #3ee0c5 0%, #3d8dff 52%, #243056 100%); }
    .section-note { color: rgba(244, 247, 255, 0.82); }
    .mini-art {
      position: absolute;
      right: 6px;
      bottom: 8px;
      width: 74px;
      height: 58px;
      pointer-events: none;
    }
    .mini-art svg { width: 100%; height: 100%; display: block; }
    .section-ico {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      margin-bottom: 8px;
      color: white;
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.18);
    }
    .section-ico svg { width: 24px; height: 24px; }
    .tint-blue {
      background: linear-gradient(160deg, rgba(110, 168, 255, 0.5), rgba(91, 141, 239, 0.16));
      color: #d6e6ff;
      box-shadow: 0 0 16px rgba(110, 168, 255, 0.35);
    }
    .tint-teal {
      background: linear-gradient(160deg, rgba(110, 224, 208, 0.48), rgba(62, 207, 184, 0.12));
      color: #d9fff8;
      box-shadow: 0 0 16px rgba(110, 224, 208, 0.32);
    }
    .tint-violet {
      background: linear-gradient(160deg, rgba(186, 160, 255, 0.55), rgba(139, 116, 245, 0.16));
      color: #efe8ff;
      box-shadow: 0 0 16px rgba(186, 160, 255, 0.38);
    }
    .tint-blue svg, .tint-teal svg, .tint-violet svg { filter: drop-shadow(0 0 5px currentColor); }
    .section-name { font-size: 18px; font-weight: 680; letter-spacing: -0.02em; }
    .section-note { font-size: 14px; }

    .block-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
    }
    .block-head h2 { font-size: 26px; letter-spacing: -0.03em; }
    .tasks { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    .task {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid transparent;
      scroll-margin-bottom: 170px;
      flex-wrap: wrap;
    }
    .task.is-new { background: rgba(110, 224, 208, 0.08); }
    .task-main { display: flex; align-items: center; gap: 14px; flex: 1 1 200px; min-width: 0; }
    .task-body { min-width: 0; }
    .task-title { font-size: 17px; font-weight: 620; overflow-wrap: anywhere; }
    .task-meta { color: var(--faint); font-size: 14px; margin-top: 2px; }
    .task.is-done .task-title { color: var(--faint); text-decoration: line-through; text-decoration-thickness: 1px; }
    .tick {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1.5px solid rgba(110, 224, 208, 0.6);
      background: transparent;
      color: #042824;
      display: grid;
      place-items: center;
      flex: none;
      padding: 0;
    }
    .tick svg { width: 16px; height: 16px; }
    .task.is-done .tick, .tick.is-on { background: var(--teal); border-color: var(--teal); }
    .tick:hover { border-color: var(--teal); }
    .tick-lg { width: 42px; height: 42px; }
    .tick-lg svg { width: 20px; height: 20px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 56px;
      padding: 0 20px;
      border: 0;
      border-radius: 18px;
      background: linear-gradient(135deg, #8eb7ff 0%, #9a8cff 48%, #5fe0d2 100%);
      color: var(--ink);
      font-weight: 750;
      letter-spacing: -0.01em;
      box-shadow: 0 12px 28px rgba(120, 140, 255, 0.28);
    }
    .btn { position: relative; overflow: hidden; animation: btn-glow 4.8s ease-in-out infinite; }
    .btn::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 32%, rgba(255, 255, 255, 0.38) 50%, transparent 68%);
      transform: translateX(-130%);
      animation: sheen 5.5s ease-in-out infinite;
      pointer-events: none;
    }
    .btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .btn:active { transform: translateY(1px) scale(0.99); }
    .btn-block { width: 100%; margin-top: 14px; font-size: 17px; scroll-margin-bottom: 150px; }
    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      box-shadow: none;
      font-weight: 650;
    }
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .text-btn {
      border: 0;
      background: transparent;
      color: var(--blue);
      padding: 8px 4px;
      font-size: 14px;
      font-weight: 650;
    }
    .text-btn.danger, .danger { color: var(--rose); }
    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 8px;
      background: rgba(110, 224, 208, 0.14);
      color: var(--teal);
      font-size: 12px;
      font-weight: 700;
      margin-left: 8px;
      vertical-align: 1px;
    }
    .badge {
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 13px;
      font-weight: 700;
    }
    .badge.ok { background: rgba(110, 224, 208, 0.14); color: var(--teal); }
    .badge.warn { background: rgba(231, 194, 122, 0.14); color: var(--amber); }

    .subhead { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
    .subhead h1 { font-size: clamp(32px, 4vw, 44px); letter-spacing: -0.035em; }
    .back {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      display: grid;
      place-items: center;
      flex: none;
    }
    .back svg { width: 22px; height: 22px; }
    .stack { display: flex; flex-direction: column; gap: 14px; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .stat strong { display: block; margin-top: 8px; font-size: clamp(20px, 2.5vw, 28px); letter-spacing: -0.03em; overflow-wrap: anywhere; }
    .stat span, .label { color: var(--faint); font-size: 14px; }

    label { display: block; }
    .field { display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--muted); }
    input[type="text"], input[type="date"], input[type="time"], input[type="number"], textarea {
      width: 100%;
      min-height: 52px;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #141920;
      color: var(--text);
    }
    textarea { min-height: 140px; resize: vertical; line-height: 1.45; }
    input::placeholder, textarea::placeholder { color: var(--faint); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      min-height: 40px;
      padding: 0 14px;
    }
    .chip.is-on {
      background: rgba(110, 224, 208, 0.14);
      border-color: rgba(110, 224, 208, 0.45);
      color: var(--teal);
    }
    .checkline {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      margin: 4px 0;
    }
    .checkline input { width: 18px; height: 18px; accent-color: var(--teal-deep); }
    button.checkline { width: 100%; color: inherit; background: transparent; border: 0; font: inherit; text-align: left; cursor: pointer; }
    .speak-mark {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 1.5px solid var(--teal);
      display: inline-grid;
      place-items: center;
      color: var(--ink);
      font-style: normal;
      font-weight: 800;
    }
    button.checkline[aria-pressed="true"] .speak-mark { background: var(--teal); }
    .error { min-height: 1.2em; color: var(--rose); font-size: 14px; }

    .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin: 8px 0 16px; }
    .day {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 18px;
      min-height: 84px;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--muted);
    }
    .day strong { color: var(--text); font-size: 18px; }
    .day.is-on { border-color: rgba(110, 224, 208, 0.55); background: #243038; color: var(--teal); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); display: block; }
    .dot.is-off { background: transparent; }

    .ring-wrap { display: flex; align-items: center; gap: 22px; }
    .ring {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(from 210deg, #7eb6ff, #c4b0ff, #6ee0d0 calc(var(--p) * 1%), rgba(255, 255, 255, 0.08) 0);
      flex: none;
    }
    .ring span {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #1a2029;
      font-size: 26px;
      font-weight: 730;
    }
    .bar-row { margin-top: 14px; }
    .bar-row header { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; margin-bottom: 6px; }
    .bar { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.06); overflow: hidden; }
    .bar i { display: block; height: 100%; width: var(--w); border-radius: inherit; background: linear-gradient(90deg, #6ea8ff, #b9a6ff, #5eecd8); }

    .drops { display: flex; flex-wrap: wrap; gap: 14px 16px; margin: 16px 0 4px; }
    .drop {
      width: 48px;
      height: 64px;
      flex: 0 0 48px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: rgba(130, 176, 255, 0.32);
      display: block;
    }
    .drop svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .drop svg path { fill: currentColor; }
    .drop svg ellipse { fill: rgba(255, 255, 255, 0.62); }
    .drop.is-on {
      color: #3d92ff;
      filter: drop-shadow(0 0 7px rgba(61, 146, 255, 0.95)) drop-shadow(0 0 16px rgba(90, 170, 255, 0.55));
    }
    .drop:hover { transform: translateY(-3px); }
    .drop:active { transform: scale(0.96); }
    .person { display: flex; gap: 14px; align-items: flex-start; }
    .avatar, .avatar-lg {
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: linear-gradient(160deg, #9ec4ff, #6ee0d0 55%, #c4b0ff);
      color: var(--ink);
      font-weight: 760;
      flex: none;
    }
    .avatar { width: 48px; height: 48px; }
    .avatar-lg { width: 72px; height: 72px; border-radius: 24px; font-size: 28px; }
    .profile-head { display: flex; align-items: center; gap: 16px; }
    .money.plus { color: var(--teal); }
    .money.minus { color: var(--rose); }
    .op { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
    .op:first-child { border-top: 0; }
    .goal-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .empty { color: var(--muted); padding: 8px 0 2px; }

    .nav {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      width: min(820px, calc(100% - 20px));
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 4px;
      padding: 10px 8px 12px;
      overflow-x: auto;
      border-radius: 28px;
      background: rgba(22, 26, 33, 0.86);
      border: 1px solid var(--line);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(16px);
      z-index: 5;
    }
    .nav-btn {
      flex: 1 1 0;
      min-width: 0;
      border: 0;
      background: transparent;
      color: var(--faint);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 4px 0;
      font-size: clamp(9px, 2.5vw, 12px);
      font-weight: 680;
    }
    .nav-btn span { line-height: 1.15; text-align: center; }
    .nav-btn svg { width: 22px; height: 22px; }
    .nav-btn.is-on { color: var(--violet); }
    .nav-btn.is-on svg { filter: drop-shadow(0 0 6px rgba(196, 176, 255, 0.85)); }
    .bubble {
      width: 48px;
      height: 48px;
      margin-top: -20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, #b7fff6, #7eb6ff 50%, #c4b0ff);
      color: #102038;
      box-shadow: 0 10px 24px rgba(140, 160, 255, 0.4);
    }
    .bubble svg { width: 24px; height: 24px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 168px;
      transform: translateX(-50%) translateY(8px);
      background: #314055;
      color: var(--text);
      border: 1px solid rgba(110, 224, 208, 0.35);
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 650;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: 0.25s ease;
      z-index: 6;
      max-width: calc(100% - 32px);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .live-ico { display: grid; place-items: center; transition: transform 0.3s ease, filter 0.3s ease; }
    .live-ico svg { width: 24px; height: 24px; animation: ico-float 3.8s ease-in-out infinite; }
    .kind-heart svg { animation-name: ico-beat; }
    .kind-plan svg, .kind-file svg { animation-name: ico-tilt; }
    .kind-chart svg, .kind-target svg { animation-name: ico-rise; }
    .kind-users svg, .kind-home svg, .kind-spark svg { animation-name: ico-float; }
    .section-card:hover .live-ico, .nav-btn:hover .live-ico, .back:hover .live-ico {
      transform: scale(1.14) translateY(-2px);
      filter: drop-shadow(0 0 10px currentColor);
    }
    .section-card:active .live-ico, .nav-btn:active .live-ico { transform: scale(0.94); }
    .card, .section-card, .hello { animation: rise-in 0.55s ease both; }
    .sections .section-card:nth-child(2) { animation-delay: 0.05s; }
    .sections .section-card:nth-child(3) { animation-delay: 0.1s; }

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, function (ch) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
      });
    }

    function uid() {
      return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
    }

    function isoDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + d;
    }

    function parseIso(iso) {
      const parts = String(iso || "").split("-").map(Number);
      return new Date(parts[0], (parts[1] || 1) - 1, parts[2] || 1);
    }

    function addDays(n) {
      const date = new Date();
      date.setHours(12, 0, 0, 0);
      date.setDate(date.getDate() + n);
      return date;
    }

    function todayIso() {
      return isoDate(new Date());
    }

    function nowDateText() {
      return new Intl.DateTimeFormat("ru-RU", { weekday: "long", day: "numeric", month: "long" }).format(new Date());
    }

    function nowTimeText() {
      return new Intl.DateTimeFormat("ru-RU", { hour: "2-digit", minute: "2-digit" }).format(new Date());
    }

    function timePlus(minutes) {
      const date = new Date(Date.now() + minutes * 60000);
      return String(date.getHours()).padStart(2, "0") + ":" + String(date.getMinutes()).padStart(2, "0");
    }

    function nowLine() {
      return nowDateText() + ", " + nowTimeText();
    }

    function greetingWord() {
      const hour = new Date().getHours();
      if (hour >= 5 && hour < 12) return "Доброе утро";
      if (hour >= 12 && hour < 18) return "Добрый день";
      return "Добрый вечер";
    }

    function personName() {
      const name = String(state.name || "").replace(/\s+/g, " ").trim();
      return name || "Алексей";
    }

    function phraseOfDay() {
      const now = new Date();
      const start = new Date(now.getFullYear(), 0, 0);
      const day = Math.floor((now - start) / 86400000);
      return PHRASES[Math.abs(day) % PHRASES.length];
    }

    function clockFull() {
      return '<p class="js-clock-full date-line">' + esc(nowLine()) + "</p>";
    }

    function clockTime() {
      return '<span class="js-clock-time">' + esc(nowTimeText()) + "</span>";
    }

    function plural(n, one, few, many) {
      const n10 = n % 10;
      const n100 = n % 100;
      if (n10 === 1 && n100 !== 11) return one;
      if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return few;
      return many;
    }

    function sectionById(id) {
      return SECTIONS.find(function (item) { return item.id === id; }) || SECTIONS[0];
    }

    function dayTitle(iso) {
      if (iso === todayIso()) return "Сегодня";
      if (iso === isoDate(addDays(1))) return "Завтра";
      return new Intl.DateTimeFormat("ru-RU", { day: "numeric", month: "long" }).format(parseIso(iso));
    }

    function rub(n) {
      return new Intl.NumberFormat("ru-RU").format(Math.round(Number(n) || 0)) + " ₽";
    }

    function signedMoney(n) {
      const value = Number(n) || 0;
      const text = new Intl.NumberFormat("ru-RU").format(Math.abs(Math.round(value))) + " ₽";
      if (value > 0) return "+" + text;
      if (value < 0) return "−" + text;
      return text;
    }

    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return seed();
        const data = JSON.parse(raw);
        if (!data || !Array.isArray(data.tasks) || !data.health || !data.finance || !Array.isArray(data.goals) || !Array.isArray(data.documents) || !Array.isArray(data.family)) {
          return seed();
        }
        const legacy = { "t-focus": "10:30", "t-walk": "14:00", "t-budget": "16:30", "t-mom": "19:00", "t-labs": "09:30" };
        const shift = { "t-focus": 0, "t-walk": 60, "t-budget": 120, "t-mom": 180, "t-labs": 0 };
        data.tasks.forEach(function (task) {
          if (task && legacy[task.id] && task.time === legacy[task.id]) task.time = timePlus(shift[task.id]);
        });
        if (!data.name || !String(data.name).trim()) data.name = "Алексей";
        if (typeof data.voiceSpeak !== "boolean") data.voiceSpeak = true;
        return data;
      } catch (error) {
        return seed();
      }
    }

      try {
        localStorage.setItem(KEY, JSON.stringify(state));

        toast("Не удалось сохранить данные в браузере");
      }
    }

    function currentFocus() {
      return state.tasks.find(function (task) { return task.focus && !task.done; })
        || state.tasks.find(function (task) { return task.focus; })
        || null;

    function openCount(sectionId) {
      return state.tasks.filter(function (task) {
        return !task.done && (!sectionId || task.section === sectionId);

    function sectionNote(id) {
      if (id === "tasks") {
        const n = openCount();
        return n ? n + " " + plural(n, "дело", "дела", "дел") + " в работе" : "всё спокойно";
      }
      if (id === "health") return state.health.water + " из 8 капель";
      if (id === "finance") return rub(state.finance.balance);
      if (id === "goals") {
        const n = state.goals.filter(function (goal) { return goal.progress < 100; }).length;
        return n + " " + plural(n, "цель", "цели", "целей") + " в пути";

      if (id === "documents") {
        const n = state.documents.filter(function (doc) { return doc.status === "внимание"; }).length;

      return n + " " + plural(n, "близкий", "близких", "близких");

    function sortTasks(list) {
      return list.slice().sort(function (a, b) {
        if (a.done !== b.done) return a.done ? 1 : -1;
        return String(a.time || "99:99").localeCompare(String(b.time || "99:99"));
      });

    function adjustMoney(signed, dir) {
      const amount = Number(signed) || 0;
      state.finance.balance = Number(state.finance.balance) + amount * dir;
      if (amount >= 0) state.finance.monthIncome = Math.max(0, Number(state.finance.monthIncome) + amount * dir);
      else state.finance.monthExpense = Math.max(0, Number(state.finance.monthExpense) + Math.abs(amount) * dir);
    }

    function monthBalance() {
      return Number(state.finance.monthIncome) - Number(state.finance.monthExpense);
    }

    function addMoney(kind, amount, category, comment) {
      const signed = kind === "income" ? amount : -amount;
      const name = String(category || "").replace(/\s+/g, " ").trim().slice(0, 80);
      state.finance.ops.push({
        id: uid(),
        title: name,
        category: name,
        comment: String(comment || "").replace(/\s+/g, " ").trim().slice(0, 140),
        amount: signed,
        date: todayIso()
      });
      adjustMoney(signed, 1);
    }

    function removeMoney(op) {
      state.finance.ops = state.finance.ops.filter(function (item) { return item.id !== op.id; });
      adjustMoney(Number(op.amount), -1);
    }

      const section = sectionById(task.section);
      const done = task.done ? " is-done" : "";
      const fresh = ui.flashId === task.id ? " is-new" : "";
      let extra = "";
      if (manage) {
        if (!task.done && !task.focus) {
          extra += '<button type="button" class="text-btn" data-action="make-focus" data-id="' + task.id + '">В фокус</button>';
        }
        if (ui.deleteId === task.id) {
          extra += '<button type="button" class="text-btn danger" data-action="confirm-delete" data-id="' + task.id + '">Удалить</button>';
        } else {
          extra += '<button type="button" class="text-btn" data-action="ask-delete" data-id="' + task.id + '">Удалить</button>';
        }
      }
      const pill = task.focus && !task.done ? '<span class="pill">Фокус</span>' : "";
      return '<li class="task' + done + fresh + '">' +
        '<div class="task-main">' +
          '<button type="button" class="tick' + (task.done ? " is-on" : "") + '" data-action="toggle" data-id="' + task.id + '" aria-pressed="' + task.done + '" aria-label="' + (task.done ? "Вернуть дело в работу" : "Завершить дело") + '">' +

        "</div>" + extra + "</li>";

    function atNoon(year, month, day) {
      return new Date(year, month - 1, day, 12, 0, 0, 0);
    }

    function shiftDays(date, days) {
      const next = new Date(date.getTime());
      next.setDate(next.getDate() + days);
      return next;
    }

    function longDate(date) {
      return new Intl.DateTimeFormat("ru-RU", { day: "numeric", month: "long" }).format(date);
    }

    function longDateYear(date) {
      return new Intl.DateTimeFormat("ru-RU", { day: "numeric", month: "long", year: "numeric" }).format(date);
    }

    function daysUntil(date) {
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12, 0, 0, 0);
      const target = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12, 0, 0, 0);
      return Math.round((target - start) / 86400000);
    }

    function whenLabel(date) {
      const n = daysUntil(date);
      if (n === 0) return "сегодня";
      if (n < 0) {
        const ago = Math.abs(n);
        return ago + " " + plural(ago, "день", "дня", "дней") + " назад";
      }
      if (n === 1) return "завтра";
      if (n === 2) return "послезавтра";
      return "через " + n + " " + plural(n, "день", "дня", "дней");
    }

    function orthodoxEaster(year) {
      const a = year % 4;
      const b = year % 7;
      const c = year % 19;
      const d = (19 * c + 15) % 30;
      const e = (2 * a + 4 * b - d + 34) % 7;
      const month = Math.floor((d + e + 114) / 31);
      const day = ((d + e + 114) % 31) + 1;
      const date = atNoon(year, month, day);
      date.setDate(date.getDate() + (year >= 2100 ? 14 : 13));
      return date;
    }

    function hol(date, id, title, kind, tone, quiet) {
      return { date: date, id: id, title: title, kind: kind, tone: tone, quiet: Boolean(quiet) };
    }

    function lastWeekday(year, monthIndex, weekday) {
      const last = new Date(year, monthIndex + 1, 0, 12, 0, 0, 0);
      const delta = (last.getDay() - weekday + 7) % 7;
      last.setDate(last.getDate() - delta);
      return last;
    }

    function holidayMap(year) {
      const map = {};
      holidayCatalog(year).forEach(function (item) {
        const key = isoDate(item.date);
        const prev = map[key];
        if (!prev) map[key] = item;
        else if (prev.quiet && !item.quiet) map[key] = item;
        else if (!prev.quiet && !item.quiet && prev.title.indexOf(item.title) === -1) {
          map[key] = {
            date: prev.date,
            id: prev.id,
            title: prev.title + " · " + item.title,
            kind: prev.kind === item.kind ? prev.kind : "both",
            tone: prev.tone,
            quiet: false
          };
        }
      });
      return map;
    }

    function upcomingHolidays(limit) {
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12, 0, 0, 0);
      const list = holidayCatalog(now.getFullYear()).concat(holidayCatalog(now.getFullYear() + 1));
      return list.filter(function (item) { return !item.quiet && item.date >= start; }).slice(0, limit || 4);
    }

    function holidayCard(item) {
      return '<article class="hol-tile tone-' + item.tone + '">' +
        holidayArt(item.id) +
        "<h3>" + esc(item.title) + "</h3>" +
        "<p>" + esc(longDate(item.date)) + "</p>" +
        '<p class="hol-when">' + esc(whenLabel(item.date)) + "</p>" +
        '<p class="hol-kind">' + esc(kindLabel(item.kind)) + "</p>" +
        "</article>";
    }

    function holidaysHomeHtml() {
      const items = upcomingHolidays(4).map(holidayCard).join("");
      return '<section class="card" id="holidays"><div class="block-head"><div><h2>Ближайшие праздники</h2><p class="lead">Государственные, православные и профессиональные</p></div><button type="button" class="text-btn" data-action="go-holidays">Все праздники</button></div><div class="holiday-grid">' + items + "</div></section>";
    }

    function holidaysOnDate(date) {
      const all = holidayCatalog(date.getFullYear()).filter(function (item) {
        return isoDate(item.date) === isoDate(date);
      });
      const named = all.filter(function (item) { return !item.quiet; });
      const source = named.length ? named : all;
      const seen = {};
      return source.filter(function (item) {
        if (seen[item.title]) return false;
        seen[item.title] = true;
        return true;
      });
    }

    function holidayWish(item) {
      const name = personName();
      const lines = {
        driver: name + ", с Днём автомобилиста! Пусть дорога будет спокойной, а каждый путь приводит к своим.",
        ny: name + ", с Новым годом! Пусть начало будет тихим и добрым.",
        xmas: name + ", с Рождеством! Пусть в доме будет тепло.",
        easter: name + ", Христос воскресе! Светлого и мирного праздника.",
        victory: name + ", с Днём Победы. Низкий поклон тем, благодаря кому мы живём.",
        women: name + ", с весенним праздником! Пусть рядом будет забота.",
        defender: name + ", с Днём защитника Отечества. Спасибо за спокойствие рядом.",
        russia: name + ", с Днём России! Хорошо, что этот день ваш.",
        teacher: name + ", с Днём учителя! Пусть знание приходит легко.",
        school: name + ", с Днём знаний! Хороший день, чтобы узнать что-то новое.",
        space: name + ", с Днём космонавтики! Пусть сегодня найдётся место и для большой мечты.",
        children: name + ", с Днём защиты детей. Берегите радость — свою и тех, кто рядом."
      };
      return lines[item.id] || (name + ", с праздником «" + item.title + "»! Пусть этот день будет тёплым и удачным.");
    }

    function todayFestHtml() {
      const list = holidaysOnDate(new Date());
      const cards = list.length
        ? list.map(function (item) {
          return '<article class="today-hol tone-' + item.tone + '"><div class="kicker"><i></i>' + esc(kindLabel(item.kind)) + "</div>" +
            holidayArt(item.id) + "<h2>" + esc(item.title) + "</h2><p>" + esc(holidayWish(item)) + "</p></article>";
        }).join("")
        : '<article class="today-hol tone-sky"><div class="kicker"><i></i>Сегодня</div>' + holidayArt("plain") +
          "<h2>Сегодня отличный день для важных дел</h2><p>" + esc(personName() + ", выберите одно главное дело. Остальное может подождать.") + "</p></article>";
      return '<section class="today-hols" aria-label="Праздники сегодня"><div class="block-head"><h2>Праздники сегодня</h2></div>' + cards + "</section>";
    }

    function assistantHomeHtml() {
      return '<button type="button" class="assist-entry" data-action="go-assistant">' +
        liveSvg("spark") +
        "<strong>Помощник</strong>" +
        "<span>Разобрать день, собрать обращение или подготовить документ к объяснению. Пока это локальный режим, без искусственного интеллекта.</span>" +
        "</button>";
    }

    function capWord(text) {
      const value = String(text || "");
      return value.charAt(0).toUpperCase() + value.slice(1);
    }

    function viewHolidays() {
      const year = new Date().getFullYear();
      const map = holidayMap(year);
      const week = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
      const today = todayIso();
      let months = "";
      for (let month = 0; month < 12; month += 1) {
        const name = capWord(new Intl.DateTimeFormat("ru-RU", { month: "long" }).format(new Date(year, month, 1)));
        const first = new Date(year, month, 1);
        const shift = (first.getDay() + 6) % 7;
        const count = new Date(year, month + 1, 0).getDate();
        let cells = week.map(function (label) { return '<span class="wd">' + label + "</span>"; }).join("");
        for (let i = 0; i < shift; i += 1) cells += '<span class="cal-empty"></span>';
        for (let day = 1; day <= count; day += 1) {
          const date = atNoon(year, month + 1, day);
          const key = isoDate(date);
          const item = map[key];
          const todayCls = key === today ? " is-today" : "";
          if (item) {
            const label = item.title + ", " + longDate(date);
            cells += '<button type="button" class="cal-day tone-' + item.tone + todayCls + '" data-action="holiday-info" data-name="' + esc(label) + '" aria-label="' + esc(label) + '">' + day + "</button>";
          } else {
            cells += '<span class="cal-day' + todayCls + '">' + day + "</span>";
          }
        }
        months += '<article class="card month-card"><h3>' + esc(name) + '</h3><div class="cal">' + cells + "</div></article>";
      }
      const list = holidayCatalog(year).filter(function (item) { return !item.quiet; }).map(holidayCard).join("");
      return pageHead("Праздники " + year, "Календарь на год") +
        '<section class="card"><p class="lead">Даты берутся с этого устройства. Православные переходящие праздники посчитаны по церковному календарю. Переносы выходных правительство утверждает отдельно: на календаре отмечены сами праздники. 2–6 и 8 января — новогодние каникулы.</p><p class="fine">Нажмите на цветной день, чтобы увидеть название.</p></section>' +
        '<div class="year-grid">' + months + "</div>" +
        '<section class="card" style="margin-top:14px"><h2>Все праздники года</h2><div class="holiday-grid">' + list + "</div></section>";
    }

    function dayPlanText() {
      const today = todayIso();
      const open = state.tasks.filter(function (task) { return task.date === today && !task.done; });
      const done = state.tasks.filter(function (task) { return task.date === today && task.done; }).length;
      const lines = ["Это локальный разбор ваших дел в браузере. Это не искусственный интеллект и не ответ из сети.", ""];
      if (!open.length) {
        lines.push("На сегодня открытых дел нет.");
        if (done) lines.push("Уже отмечено готовым: " + done + " " + plural(done, "дело", "дела", "дел") + ".");
        lines.push("День можно оставить тихим или добавить одно короткое дело.");
      } else {
        const ordered = open.slice().sort(function (a, b) {
          if (Boolean(a.focus) !== Boolean(b.focus)) return a.focus ? -1 : 1;
          return String(a.time || "99:99").localeCompare(String(b.time || "99:99"));
        });
        lines.push("Предлагаю такой порядок:");
        ordered.forEach(function (task, index) {
          const mark = task.focus ? " — начать с этого, это фокус дня" : "";
          lines.push((index + 1) + ". " + task.title + " (" + sectionById(task.section).title + ")" + mark);
        });
        if (ordered.length > 4) {
          lines.push("");
          lines.push("Если день плотный, сделайте первые три пункта. Остальное можно спокойно перенести.");
        }
        if (done) lines.push("Уже сделано сегодня: " + done + ".");
      }
      const water = Number(state.health.water) || 0;
      lines.push("");
      if (water < 8) lines.push("Вода: " + water + " из 8 капель. Между делами можно добрать ещё " + (8 - water) + ".");
      else lines.push("Вода на сегодня уже отмечена полностью.");
      return lines.join("\n");
    }

    function appealText(to, topic, essence) {
      const from = personName();
      const date = longDateYear(new Date());
      return [
        to,
        "от " + from,
        "",
        topic,
        "",
        "Здравствуйте.",
        "",
        "Прошу рассмотреть обращение по теме: " + topic + ".",
        "",
        essence,
        "",
        "Прошу сообщить о результате. Благодарю за внимание.",
        "",
        "С уважением,",
        from,
        date
      ].join("\n");
    }

    function explainReply(text) {
      const clean = String(text || "").replace(/\s+/g, " ").trim();
      const preview = clean.slice(0, 180);
      return [
        "Текст принят на этом экране: " + clean.length + " " + plural(clean.length, "знак", "знака", "знаков") + ".",
        "Он никуда не отправлен и в браузере не сохраняется.",
        "",
        "Начало текста: «" + preview + (clean.length > 180 ? "…" : "") + "».",
        "",
        "Простыми словами документ можно будет объяснить после подключения ИИ через API. Сейчас локальный режим этого не делает и не подменяет объяснение догадкой.",
        "",
        "Это не искусственный интеллект."
      ].join("\n");
    }

    function captureAssist() {
      const appeal = document.getElementById("appeal-form");
      if (appeal) {
        const data = new FormData(appeal);
        ui.appeal.to = String(data.get("to") || "");
        ui.appeal.topic = String(data.get("topic") || "");
        ui.appeal.essence = String(data.get("essence") || "");
      }
      const explain = document.getElementById("explain-form");
      if (explain) ui.explain = String(new FormData(explain).get("source") || "");
    }

    function beginReply(userText, producer) {
      if (ui.typing) {
        toast("Подождите, собираю ответ…");
        return;
      }
      captureAssist();
      ui.chat.push({ from: "user", text: userText });
      if (ui.chat.length > 40) ui.chat = ui.chat.slice(-30);
      ui.typing = true;
      render();
      clearTimeout(assistTimer);
      assistTimer = setTimeout(function () {
        ui.typing = false;
        if (ui.view !== "assistant") return;
        const result = producer();
        ui.chat.push({ from: "bot", text: result.text, letter: result.letter || null });
        render();
      }, 850);
    }

    function assistPanel() {
      if (ui.assistMode === "appeal") {
        const form = ui.appeal;
        return '<form class="card stack" id="appeal-form" style="margin-top:14px" novalidate><h2>Черновик обращения</h2>' +
          '<label class="field">Кому<input name="to" type="text" maxlength="140" value="' + esc(form.to) + '" placeholder="Например, в управляющую компанию"></label>' +
          '<label class="field">Тема<input name="topic" type="text" maxlength="140" value="' + esc(form.topic) + '" placeholder="Например, протечка крыши"></label>' +
          '<label class="field">Суть обращения<textarea name="essence" maxlength="4000" placeholder="Коротко опишите, что произошло и о чём просите">' + esc(form.essence) + "</textarea></label>" +
          '<p class="error">' + esc(form.error) + '</p><button class="btn" type="submit">Собрать черновик</button></form>';
      }
      if (ui.assistMode === "explain") {
        return '<form class="card stack" id="explain-form" style="margin-top:14px" novalidate><h2>Текст документа</h2><p class="lead">Вставьте текст. Он останется только на этом экране.</p>' +

    function copyPlain(text) {
      const done = function () { toast("Текст скопирован"); };
      const fail = function () { toast("Не удалось скопировать. Выделите текст вручную"); };
      const fallback = function () {
        const area = document.createElement("textarea");
        area.value = text;
        area.setAttribute("readonly", "");
        area.style.position = "fixed";
        area.style.left = "-9999px";
        document.body.appendChild(area);
        area.select();
        try {
          const ok = document.execCommand("copy");
          area.remove();
          if (ok) done();
          else fail();
        } catch (error) {
          area.remove();
          fail();
        }
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done, fallback);
        return;
      }
      fallback();
    }

    function render() {

    function stopSpeaking() {
      speakToken += 1;
      if (!window.speechSynthesis) return;
      try { window.speechSynthesis.cancel(); } catch (error) { /* озвучка уже остановлена */ }
    }

    function haltRecognition() {
      listening = false;
      commandListening = false;
      const rec = recognizer;
      recognizer = null;
      if (!rec) return;
      rec.onresult = null;
      rec.onerror = null;
      rec.onend = null;
      try { rec.stop(); } catch (error) { /* распознавание уже остановлено */ }
    }

    function stopVoice() {
      haltRecognition();
      stopSpeaking();
    }

    function go(view) {
      if (view !== "add") stopVoice();
      if (view !== "assistant") {
        ui.typing = false;
        clearTimeout(assistTimer);
      }
      if (ui.view !== view) ui.scrollTop = true;
      ui.view = view;
      ui.deleteId = null;
      render();

    function toast(text) {
      const el = document.getElementById("toast");
      el.textContent = text;
      el.classList.add("show");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(function () { el.classList.remove("show"); }, 2400);

    function openAdd(section, asFocus) {

    function speechText(event) {
      let text = "";
      let isFinal = false;
      for (let i = 0; i < event.results.length; i += 1) {
        text += event.results[i][0].transcript;
        if (event.results[i].isFinal) isFinal = true;
      }
      return { text: text.replace(/\s+/g, " ").trim(), isFinal: isFinal };
    }

    function normCommand(value) {
      return String(value || "").toLowerCase().replace(/ё/g, "е").replace(/[^a-zа-я0-9\s]/gi, " ").replace(/\s+/g, " ").trim();
    }

    function parseAmountPrefix(text) {
      const raw = String(text || "").trim();
      const digit = raw.match(/^(\d{1,3}(?:\s\d{3})+|\d+)(?:[.,](\d+))?/);
        if (digit) {
        let value = Number(digit[1].replace(/\s/g, "") + (digit[2] ? "." + digit[2] : ""));
        let rest = raw.slice(digit[0].length).trim();
        if (/^тысяч/.test(rest)) {
          value *= 1000;
          rest = rest.replace(/^тысяч(?:а|и)?\s*/, "");
        }
        if (!value) return null;
        return { value: value, rest: rest };
      }
      const words = {
        ноль: 0, один: 1, одна: 1, одно: 1, два: 2, две: 2, три: 3, четыре: 4, пять: 5,
        шесть: 6, семь: 7, восемь: 8, девять: 9, десять: 10, одиннадцать: 11, двенадцать: 12,
        тринадцать: 13, четырнадцать: 14, пятнадцать: 15, шестнадцать: 16, семнадцать: 17,
        восемнадцать: 18, девятнадцать: 19, двадцать: 20, тридцать: 30, сорок: 40,
        пятьдесят: 50, шестьдесят: 60, семьдесят: 70, восемьдесят: 80, девяносто: 90,
        сто: 100, двести: 200, триста: 300, четыреста: 400, пятьсот: 500, шестьсот: 600,
        семьсот: 700, восемьсот: 800, девятьсот: 900
      };
      const parts = raw.split(" ");
      let total = 0;
      let current = 0;
      let saw = false;
      let used = 0;
      for (let i = 0; i < parts.length; i += 1) {
        const word = parts[i];
        if (word.indexOf("тысяч") === 0) {
          current = (current || 1) * 1000;
          total += current;
          current = 0;
          saw = true;
          used = i + 1;
          continue;
        }
        if (words[word] == null) break;
        current += words[word];
        saw = true;
        used = i + 1;
      }
      if (!saw) return null;
      return { value: total + current, rest: parts.slice(used).join(" ") };
    }

    function findTaskBySpeech(query) {
      const q = normCommand(query);
      if (q.length < 2) return null;
      let best = null;
      let score = 0;
      state.tasks.forEach(function (task) {
        const title = normCommand(task.title);
        let next = 0;
        if (title === q) next = 1000;
        else if (title.indexOf(q) !== -1) next = 200 + q.length;
        else if (q.indexOf(title) !== -1 && title.length > 2) next = 100 + title.length;
        if (next > score) {
          score = next;
          best = task;
        }
      });
      return best;
    }

    function findMoneyBySpeech(kind, query) {
      const q = normCommand(query);
      const ops = state.finance.ops.slice().reverse();
      return ops.find(function (op) {
        if (kind === "expense" && !(Number(op.amount) < 0)) return false;
        if (kind === "income" && !(Number(op.amount) > 0)) return false;
        const hay = normCommand((op.category || op.title || "") + " " + (op.comment || ""));
        return q && hay.indexOf(q) !== -1;
      }) || null;
    }

    function moodFromSpeech(words) {
      const w = normCommand(words);
      if (/хорош|отличн|прекрас/.test(w)) return "Хорошее";
      if (/спокой/.test(w)) return "Спокойный";
      if (/бодр|энерг/.test(w)) return "Бодрый";
      if (/устал/.test(w)) return "Устал";
      if (/напряж|плох|тяжел/.test(w)) return "Напряжён";
      return "";
    }

    function cleanSpeech(value) {
      return String(value || "").replace(/\s+/g, " ").trim();
    }

    function capFirst(value) {
      const text = cleanSpeech(value);
      if (!text) return "";
      return text.charAt(0).toUpperCase() + text.slice(1);
    }

    function isYes(text) {
      return /^(да|удали|удаляй|подтверждаю|подтверди|хорошо|верно|ага)$/.test(text);
    }

    function isNo(text) {
      return /^(нет|отмена|отмени|не надо|не удаляй)$/.test(text);
    }

    function isCancel(text) {
      return /^(отмена|отмени|отменить|не надо|хватит|стоп)$/.test(text);
    }

    function isRepeat(text) {
      return /^(повтори|повторить|повтори вопрос|ещё раз|еще раз|повтор)$/.test(text);
    }

    function sectionTail(text) {
      return text
        .replace(/^(?:пожалуйста\s+)?(?:добавь|добавить|создай|создать|запиши|записать)\s+/, "")
        .replace(/^(?:ещё|еще|новую|новый|новое|нового|новая)\s+/, "")
        .replace(/^в\s+/, "")
        .trim();
    }

    function deleteTail(text) {
      return text.replace(/^(?:удали|удалить|убери|убрать)\s+/, "").replace(/^в\s+/, "").trim();
    }

    function matchKind(text) {
      const rules = [
        ["task", /^(?:задач(?:а|у|и|ей|е|ка|ку|ки)?|дело|дела)(?:\s+(.+))?$/],
        ["expense", /^расход(?:а|у|ом|е|ы)?(?:\s+(.+))?$/],
        ["income", /^доход(?:а|у|ом|е|ы)?(?:\s+(.+))?$/],
        ["document", /^документ(?:а|у|ом|е|ы|ов)?(?:\s+(.+))?$/],
        ["health", /^здоров(?:ье|ья|ью|ьем)?(?:\s+(.+))?$/],
        ["goal", /^цел(?:ь|и|ью|ям|ями|ях|ей)?(?:\s+(.+))?$/],
        ["family", /^сем(?:ья|ью|ье|ьи|ей)(?:\s+(.+))?$/]
      ];
      for (let i = 0; i < rules.length; i += 1) {
        const found = text.match(rules[i][1]);
        if (found) return { kind: rules[i][0], rest: cleanSpeech(found[1] || "") };
      }
      return null;
    }

    function spokenRest(raw, rest) {
      if (!rest) return "";
      const words = cleanSpeech(raw).split(" ");
      const count = rest.split(" ").length;
      if (words.length >= count) return words.slice(words.length - count).join(" ");
      return rest;
    }

    function russianVoice() {
      if (!window.speechSynthesis) return null;
      const list = window.speechSynthesis.getVoices() || [];
      for (let i = 0; i < list.length; i += 1) {
        if (/^ru([-_]|$)/i.test(list[i].lang || "")) return list[i];
      }
      return null;
    }

    function speak(text, then) {
      if (!text) {
        if (then) then();
        return;
      }
      if (state.voiceSpeak === false || !window.speechSynthesis || typeof window.SpeechSynthesisUtterance !== "function") {
        if (then) then();
        return;
      }
      stopSpeaking();
      const token = speakToken;
      const queued = Date.now();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "ru-RU";
      const voice = russianVoice();
      if (voice) utter.voice = voice;
      let started = 0;
      utter.onstart = function () { started = Date.now(); };
      const finish = function () {
        if (token !== speakToken) return;
        if (started && Date.now() - started < 280) return;
        if (!started && Date.now() - queued < 280) return;
        if (then) then();
      };
      utter.onend = finish;
      utter.onerror = function () {
        if (token !== speakToken) return;
        if (then) then();
      };
      setTimeout(function () {
        if (token !== speakToken) return;
        try {
          window.speechSynthesis.resume();
          window.speechSynthesis.speak(utter);
        } catch (error) {
          if (then) then();
        }
      }, 40);
    }

    function speakThenListen(text) {
      render();
      speak(text, function () {
        if (!ui.dialog && !ui.voiceConfirm) return;
        startCommandVoice(true);
      });
    }

    function finishMessage(message) {
      ui.dialog = null;
      ui.voiceConfirm = null;
      ui.voiceMessage = message;
      render();
      speak(message);
    }

    function ask(step, question, draft) {
      const prev = (ui.dialog && ui.dialog.draft) || {};
      ui.voiceConfirm = null;
      ui.voiceMessage = "";
      ui.commandNote = "";
      ui.dialog = { step: step, question: question, draft: draft == null ? prev : draft };
      speakThenListen(question);
    }

    function askDelete(text, apply) {
      ui.dialog = null;
      ui.voiceConfirm = { text: text, apply: apply };
      ui.voiceMessage = "Можно ответить «да» или нажать кнопку.";
      ui.commandNote = "";
      speakThenListen(text);
    }

    function moneyFromSpeech(text) {
      let raw = normCommand(text);
      raw = raw.replace(/^(?:добавь|добавить|запиши|создай)\s+/, "");
      raw = raw.replace(/^(?:расход|доход)(?:а|у|ом|е|ы)?\s+/, "");
      raw = raw.replace(/^(?:на|в|за)\s+/, "");
      const amount = parseAmountPrefix(raw);
      if (!amount || !amount.value) return null;
      let rest = amount.rest.replace(/^(?:рублей|рубля|рубль|руб)\s+/, "");
      rest = rest.replace(/^(?:на|за)\s+/, "");
      rest = rest.replace(/^(?:категория|категорию)\s+/, "").replace(/[.,]$/, "").trim();
      let comment = "";
      const parts = rest.split(/\s+комментарий\s+/);
      if (parts.length > 1) {
        rest = parts[0].trim();
        comment = parts.slice(1).join(" ");
      }
      return { value: amount.value, category: capFirst(rest), comment: comment };
    }

    function takeMoney(kind, text) {
      const name = personName();
      const parsed = moneyFromSpeech(text);
      const step = kind === "income" ? "income" : "expense";
      const question = kind === "income"
        ? name + ", назови сумму и источник дохода."
        : name + ", назови сумму и на что потратил.";
      if (!parsed || !parsed.category) {
        ask(step, parsed && !parsed.category
          ? question + " Например: " + (kind === "income" ? "30000 пенсия." : "1500 продукты.")
          : question);
        return;
      }
      addMoney(kind, parsed.value, parsed.category, parsed.comment || "");
      save();
      finishMessage(name + ", записал " + (kind === "income" ? "доход" : "расход") + " " + rub(parsed.value) + ", «" + parsed.category + "». Баланс месяца: " + signedMoney(monthBalance()) + ".");
    }

    function addTaskTitle(title) {

      state.tasks.push(task);

      finishMessage(name + ", задача добавлена.");

    function addGoalTitle(title) {

    function applySteps(phrase, again) {
      const name = personName();
      let body = normCommand(phrase).replace(/^(?:добавь|добавить)\s+/, "");
      body = body.replace(/\s+шаг(?:ов|а|и)?$/, "");
      const amount = parseAmountPrefix(body);
      const count = amount ? Math.round(amount.value) : 0;
      if (!count || (amount && cleanSpeech(amount.rest))) {
        const question = name + ", скажите, сколько шагов добавить. Например: 500 шагов.";
        if (again) ask("health-steps", question);
        else finishMessage(question);
        return;
      }
      state.health.steps = Math.max(0, Number(state.health.steps) + count);
      save();
      finishMessage(name + ", добавил " + count + " " + plural(count, "шаг", "шага", "шагов") + ". Сейчас " + new Intl.NumberFormat("ru-RU").format(state.health.steps) + ".");
    }

    function applySleep(body, again) {
      const name = personName();
      const amount = parseAmountPrefix(body);
      if (!amount) {
        const question = name + ", не разобрал сон. Например: сон 7 часов 30 минут.";
        if (again) ask("health-sleep", question);
        else finishMessage(question);
        return;
      }
      let minutes = 0;
      const rest = amount.rest.replace(/^час(?:а|ов|ы)?\s*/, "");
      if (rest && !/^минут/.test(rest)) {
        const extra = parseAmountPrefix(rest);
        if (extra) minutes = Math.round(extra.value);
      }
      let total = Math.round(amount.value) * 60 + minutes;
      total = Math.max(0, Math.min(14 * 60, total));
      state.health.sleepHours = Math.floor(total / 60);
      state.health.sleepMinutes = total % 60;
      save();
      finishMessage(name + ", записал сон: " + state.health.sleepHours + " ч " + state.health.sleepMinutes + " мин.");
    }

    function applyMood(words, again) {
      const name = personName();
      const next = moodFromSpeech(words);
      if (!next) {
        const question = name + ", какое самочувствие: хорошее, спокойное, бодрое, устал или напряжён?";
        if (again) ask("health-mood", question);
        else finishMessage(name + ", такое самочувствие не записываю. Можно сказать: хорошее, спокойное, бодрое, устал или напряжён.");
        return;
      }
      state.health.mood = next;
      save();
      finishMessage(name + ", самочувствие отмечено: " + next + ".");
    }

    function applyKnownHealth(text) {
      if (/^(?:я\s+)?выпил[аи]?\s+стакан\s+воды$/.test(text) || text === "стакан воды" || text === "воду" || text === "вода" || text === "стакан") {
        applyWater();
        return true;
      }
      if (text.indexOf("задач") === -1 && /шаг/.test(text)) {
        const steps = text.match(/^(?:добавь|добавить\s+)?(.+?)\s+шаг(?:ов|а|и)?$/);
        if (steps) {
          applySteps(steps[1], false);
          return true;
        }
      }
      if (/^сон\s+\S/.test(text)) {
        applySleep(text.replace(/^сон\s+/, ""), false);
        return true;
      }
      const mood = text.match(/^самочувствие\s+(.+)$/);
      if (mood) {
        applyMood(mood[1], false);
        return true;
      }
      return false;
    }

    function confirmFoundTask(query) {
      const name = personName();
      const task = findTaskBySpeech(query);
      if (!task) {
        ask("delete-task", name + ", не нашёл такую задачу. Назовите название ещё раз.");
        return;
      }
      askDelete(name + ", удалить «" + task.title + "»? Скажи да или нет.", function () {
        state.tasks = state.tasks.filter(function (item) { return item.id !== task.id; });
        return name + ", задача «" + task.title + "» удалена.";
      });
    }

    function confirmFoundMoney(kind, query) {
      const name = personName();
      const op = findMoneyBySpeech(kind, query);
      const step = kind === "income" ? "delete-income" : "delete-expense";
      const what = kind === "income" ? "доход" : "расход";
      if (!op) {
        ask(step, name + ", не нашёл такой " + what + ". Назовите ещё раз.");
        return;
      }
      const label = op.category || op.title;
      askDelete(name + ", удалить " + what + " «" + label + "»? Скажи да или нет.", function () {
        removeMoney(op);
        return name + ", " + what + " «" + label + "» удалён. Баланс месяца: " + signedMoney(monthBalance()) + ".";
      });
    }

    function beginAdd(kind, raw) {
      const name = personName();
      const matched = matchKind(sectionTail(normCommand(raw)));
      const rest = matched ? matched.rest : "";
      const said = spokenRest(raw, rest);
      if (kind === "task") {
        if (said) addTaskTitle(said);
        else ask("task-title", name + ", какую задачу добавить?");
        return;
      }
      if (kind === "expense") {
        if (rest) takeMoney("expense", rest);
        else ask("expense", name + ", назови сумму и на что потратил.");
        return;
      }
      if (kind === "income") {
        if (rest) takeMoney("income", rest);
        else ask("income", name + ", назови сумму и источник дохода.");
        return;
      }
      if (kind === "document") {
        if (said) ask("doc-to", name + ", кому адресован документ?", { title: said.slice(0, 140) });
        else ask("doc-title", name + ", как назвать документ?", {});
        return;
      }
      if (kind === "health") {
        if (rest && applyKnownHealth(rest)) return;
        ask("health-pick", name + ", что добавить: воду, шаги, сон или самочувствие?");
        return;
      }
      if (kind === "goal") {
        if (said) addGoalTitle(said);
        else ask("goal-title", name + ", какую цель добавить?");
        return;
      }
      if (said) ask("family-role", name + ", кем приходится " + said + "?", { name: capFirst(said).slice(0, 40) });
      else ask("family-name", name + ", кого добавить в семью?", {});
    }

    function handleDialog(raw) {
      const text = normCommand(raw);
      const name = personName();
      const step = ui.dialog.step;
      const draft = ui.dialog.draft || {};
      if (step === "add-pick") {
        const kind = matchKind(sectionTail(text));
        if (!kind) return false;
        beginAdd(kind.kind, raw);
        return true;
      }
      if (step === "task-title") {
        addTaskTitle(cleanSpeech(raw));
        return true;
      }
      if (step === "expense") {
        takeMoney("expense", text);
        return true;
      }
      if (step === "income") {
        takeMoney("income", text);
        return true;
      }
      if (step === "doc-title") {
        const title = cleanSpeech(raw).slice(0, 140);
        if (!title) {
          ask("doc-title", name + ", как назвать документ?", {});
          return true;
        }
        ask("doc-to", name + ", кому адресован документ?", { title: title });
        return true;
      }
      if (step === "doc-to") {
        const to = cleanSpeech(raw).slice(0, 140);
        if (!to) {
          ask("doc-to", name + ", кому адресован документ?", draft);
          return true;
        }
        ask("doc-body", name + ", продиктуйте текст документа.", { title: draft.title, to: to });
        return true;
      }
      if (step === "doc-body") {
        const body = cleanSpeech(raw).slice(0, 8000);
        if (!body) {
          ask("doc-body", name + ", продиктуйте текст документа.", draft);
          return true;
        }
        storeLetter({
          id: uid(),
          title: draft.title || "Черновик",

          body: body,
