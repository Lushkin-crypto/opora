          kind: "letter",
          created: todayIso()
        });
        finishMessage(name + ", черновик документа сохранён.");
        return true;
      }
      if (step === "goal-title") {
        addGoalTitle(cleanSpeech(raw));
        return true;
      }
      if (step === "family-name") {
        const person = capFirst(cleanSpeech(raw)).slice(0, 40);
        if (!person) {
          ask("family-name", name + ", кого добавить в семью?", {});
          return true;
        }
        ask("family-role", name + ", кем приходится " + person + "?", { name: person });
        return true;
      }
      if (step === "family-role") {
        const role = cleanSpeech(raw).slice(0, 40);
        if (!role) {
          ask("family-role", name + ", кем приходится " + (draft.name || "этот человек") + "?", draft);
          return true;
        }
        state.family.push({ id: uid(), name: draft.name || "Близкий", role: role, note: "" });
        save();
        finishMessage(name + ", добавил в семью: " + (draft.name || "близкий") + ", " + role + ".");
        return true;
      }
      if (step === "health-pick") {
        if (applyKnownHealth(text)) return true;
        if (/^вод/.test(text)) {
          applyWater();
          return true;
        }
        if (/^шаг/.test(text)) {
          const inline = text.match(/^шаг(?:ов|а|и)?\s+(.+)$/);
          if (inline) applySteps(inline[1], true);
          else ask("health-steps", name + ", сколько шагов добавить?");
          return true;
        }
        if (text === "сон") {
          ask("health-sleep", name + ", сколько вы спали? Например: 7 часов 30 минут.");
          return true;
        }
        if (/^сон\s+/.test(text) || /час/.test(text)) {
          applySleep(text.replace(/^сон\s+/, ""), true);
          return true;
        }
        if (/^самочувств/.test(text)) {
          const mood = text.replace(/^самочувствие\s+/, "");
          if (mood) applyMood(mood, true);
          else ask("health-mood", name + ", какое самочувствие: хорошее, спокойное, бодрое, устал или напряжён?");
          return true;
        }
        if (moodFromSpeech(text)) {
          applyMood(text, true);
          return true;
        }
        return false;
      }
      if (step === "health-steps") {
        applySteps(text, true);
        return true;
      }
      if (step === "health-sleep") {
        applySleep(text.replace(/^сон\s+/, ""), true);
        return true;
      }
      if (step === "health-mood") {
        applyMood(text.replace(/^самочувствие\s+/, ""), true);
        return true;
      }
      if (step === "delete-pick") {
        const kind = matchKind(sectionTail(deleteTail(text)));
        if (!kind || (kind.kind !== "task" && kind.kind !== "expense" && kind.kind !== "income")) return false;
        if (kind.kind === "task") {
          if (kind.rest) confirmFoundTask(kind.rest);
          else ask("delete-task", name + ", какую задачу удалить?");
          return true;
        }
        if (kind.kind === "expense") {
          if (kind.rest) confirmFoundMoney("expense", kind.rest);
          else ask("delete-expense", name + ", какой расход удалить? Назовите категорию.");
          return true;
        }
        if (kind.rest) confirmFoundMoney("income", kind.rest);
        else ask("delete-income", name + ", какой доход удалить? Назовите источник.");
        return true;
      }
      if (step === "delete-task") {
        confirmFoundTask(text);
        return true;
      }
      if (step === "delete-expense") {
        confirmFoundMoney("expense", text);
        return true;
      }
      if (step === "delete-income") {
        confirmFoundMoney("income", text);
        return true;
      }
      return false;
    }

    function handleConfirm(text) {
      if (!ui.voiceConfirm) return false;
      if (isYes(text)) {
        const apply = ui.voiceConfirm.apply;
        ui.voiceConfirm = null;
        ui.dialog = null;
        const message = apply();
        save();
        finishMessage(message);
        return true;
      }
      if (isNo(text)) {
        ui.voiceConfirm = null;
        ui.dialog = null;
        finishMessage("Хорошо, " + personName() + ", ничего не меняю.");
        return true;
      }
      ui.voiceConfirm = null;
      return false;
    }

    function handleGlobal(raw) {
      const text = normCommand(raw);
      const name = personName();
      if (applyKnownHealth(text)) return true;
      if (text === "сон") {
        ask("health-sleep", name + ", сколько вы спали? Например: 7 часов 30 минут.");
        return true;
      }
      if (text === "самочувствие") {
        ask("health-mood", name + ", какое самочувствие: хорошее, спокойное, бодрое, устал или напряжён?");
        return true;
      }
      if (/^(?:удали|удалить|убери|убрать)$/.test(text)) {
        ask("delete-pick", name + ", что удалить: задачу, расход или доход?");
        return true;
      }
      const dropTask = text.match(/^(?:удали|удалить|убери|убрать)\s+(?:задач(?:а|у|и|ей|е)|дело|дела)\s+(.+)$/);
      if (dropTask) {
        confirmFoundTask(dropTask[1]);
        return true;
      }
      if (/^(?:удали|удалить|убери|убрать)\s+(?:задач(?:а|у|и|ей|е)|дело|дела)$/.test(text)) {
        ask("delete-task", name + ", какую задачу удалить?");
        return true;
      }
      const dropMoney = text.match(/^(?:удали|удалить|убери|убрать)\s+(расход(?:а|у|ом|е|ы)?|доход(?:а|у|ом|е|ы)?)(?:\s+(.+))?$/);
      const lastMoney = text.match(/^(?:удали|удалить)\s+последн(?:юю|ий)\s+(операцию|расход(?:а|у|ом|е|ы)?|доход(?:а|у|ом|е|ы)?)$/);
      if (dropMoney || lastMoney) {
        const kindWord = (dropMoney || lastMoney)[1];
        const kind = kindWord.indexOf("доход") === 0 ? "income" : (kindWord.indexOf("расход") === 0 ? "expense" : "any");
        if (dropMoney && !dropMoney[2]) {
          ask(kind === "income" ? "delete-income" : "delete-expense", kind === "income"
            ? name + ", какой доход удалить? Назовите источник."
            : name + ", какой расход удалить? Назовите категорию.");
          return true;
        }
        const op = lastMoney
          ? state.finance.ops.slice().reverse().find(function (item) {
            if (kind === "expense") return Number(item.amount) < 0;
            if (kind === "income") return Number(item.amount) > 0;
            return true;
          })
          : findMoneyBySpeech(kind, dropMoney[2]);
        if (!op) {
          finishMessage(name + ", не нашёл такую операцию.");
          return true;
        }
        const label = op.category || op.title;
        askDelete(name + ", удалить " + (Number(op.amount) < 0 ? "расход" : "доход") + " «" + label + "»? Скажи да или нет.", function () {
          removeMoney(op);
          return name + ", операция удалена. Баланс месяца: " + signedMoney(monthBalance()) + ".";
        });
        return true;
      }
      if (/^(?:добавь|добавить|создай|создать)$/.test(text)) {
        ask("add-pick", name + ", что добавить: задачу, расход, доход, документ, цель, здоровье или семью?");
        return true;
      }
      if (/^(?:добавь|добавить|создай|создать|запиши|записать)(?:\s|$)/.test(text)) {
        const direct = matchKind(sectionTail(text));
        if (direct) {
          beginAdd(direct.kind, raw);
          return true;
        }
      }
      const only = matchKind(text);
      if (only && !only.rest) {
        beginAdd(only.kind, raw);
        return true;
      }
      const doneTask = text.match(/^(?:выполни|выполнить|заверши|завершить|отметь)\s+(?:задач(?:а|у|и|ей|е)|дело|дела)\s+(.+)$/);
      if (doneTask) {
        const task = findTaskBySpeech(doneTask[1]);
        if (!task) finishMessage(name + ", не нашёл такую задачу.");
        else if (task.done) finishMessage(name + ", задача «" + task.title + "» уже выполнена.");
        else {
          task.done = true;
          save();
          finishMessage(name + ", задача «" + task.title + "» выполнена.");
        }
        return true;
      }
      return false;
    }

    function runCommand(raw) {
      const text = normCommand(raw);
      const name = personName();
      ui.voiceHeard = cleanSpeech(raw);
      ui.commandNote = "";
      if (!text) {
        ui.voiceMessage = name + ", я не расслышал. Повторите, пожалуйста.";
        render();
        speak(ui.voiceMessage);
        return;
      }
      if (isRepeat(text) && (ui.dialog || ui.voiceConfirm)) {
        const question = ui.voiceConfirm ? ui.voiceConfirm.text : ui.dialog.question;
        speakThenListen(question);
        return;
      }
      if (isCancel(text) && (ui.dialog || ui.voiceConfirm)) {
        finishMessage("Хорошо, " + name + ", ничего не меняю.");
        return;
      }
      if (handleConfirm(text)) return;
      if (ui.dialog) {
        if (handleDialog(raw)) return;
        if (handleGlobal(raw)) return;
        ui.voiceMessage = "";
        speakThenListen(ui.dialog.question);
        return;
      }
      if (handleGlobal(raw)) return;
      ui.voiceMessage = name + ", такую команду не разобрал. Скажите: добавь. Затем выберите задачу, расход, доход, документ, цель, здоровье или семью.";
      render();
      speak(ui.voiceMessage);
    }

    function startCommandVoice(follow) {
      const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Ctor) {
        ui.commandNote = "Голосовые команды недоступны в этом браузере. " + personName() + ", пользуйтесь кнопками на экране.";
        commandListening = false;
        renderVoice();
        speak(ui.commandNote);
        return;
      }
      const wasTitle = listening;
      if (listening) readForm();
      haltRecognition();
      if (!follow) stopSpeaking();
      ui.commandNote = "";
      commandListening = true;
      if (wasTitle) render();
      else renderVoice();
      const rec = new Ctor();
      recognizer = rec;
      rec.lang = "ru-RU";
      rec.interimResults = true;
      rec.continuous = false;
      rec.maxAlternatives = 1;
      let last = "";
      let finalText = "";
      let fail = "";
      rec.onresult = function (event) {
        const said = speechText(event);
        last = said.text;
        if (said.isFinal) finalText = said.text;
      };
      rec.onerror = function (event) {
        if (event.error === "aborted") return;
        fail = (event.error === "no-speech") ? "quiet" : "denied";
      };
      rec.onend = function () {
        if (recognizer !== rec) return;
        commandListening = false;
        recognizer = null;
        const said = finalText || last;
        if (said) runCommand(said);
        else if (fail === "denied") {
          ui.commandNote = "Голосовые команды недоступны в этом браузере. " + personName() + ", пользуйтесь кнопками на экране.";
          renderVoice();
          speak(ui.commandNote);
        } else {
          ui.voiceMessage = personName() + ", я не расслышал. Повторите, пожалуйста.";
          renderVoice();
          speak(ui.voiceMessage);
        }
      };
      try {
        rec.start();
      } catch (error) {
        commandListening = false;
        recognizer = null;
        ui.commandNote = "Голосовые команды недоступны в этом браузере. " + personName() + ", пользуйтесь кнопками на экране.";
        renderVoice();
        speak(ui.commandNote);
      }
    }

    function toggleVoice() {
      if (commandListening) stopVoice();
      if (listening) {
        readForm();
        stopVoice();
        render();
        return;
      }
      const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Ctor) {
        ui.voiceNote = VOICE_UNAVAILABLE;
        readForm();
        render();
        return;
      }
      readForm();
      listening = true;
      ui.voiceNote = "";
      render();
      const rec = new Ctor();
      recognizer = rec;
      rec.lang = "ru-RU";
      rec.interimResults = true;
      rec.continuous = false;
      rec.maxAlternatives = 1;
      rec.onresult = function (event) {
        let text = "";
        for (let i = 0; i < event.results.length; i += 1) text += event.results[i][0].transcript;
        text = text.replace(/\s+/g, " ").trim().slice(0, 140);
        if (ui.form) ui.form.title = text;
        const input = document.getElementById("task-title");
        if (input) input.value = text;
      };
      rec.onerror = function (event) {
        listening = false;
        recognizer = null;
        if (event.error === "not-allowed" || event.error === "service-not-allowed" || event.error === "audio-capture") {
          ui.voiceNote = VOICE_UNAVAILABLE;
        } else if (event.error !== "aborted" && event.error !== "no-speech") {
          ui.voiceNote = VOICE_UNAVAILABLE;
        }
        if (ui.view === "add") render();
      };
      rec.onend = function () {
        const was = listening;
        listening = false;
        recognizer = null;
        if (was && ui.view === "add") {
          readForm();
          render();
        }
      };
      try {
        rec.start();
      } catch (error) {
        listening = false;
        recognizer = null;
        ui.voiceNote = VOICE_UNAVAILABLE;
        render();
      }
    }

    function toggleTask(id) {
      const task = state.tasks.find(function (item) { return item.id === id; });
      if (!task) return;
      task.done = !task.done;
      save();
      toast(task.done ? "Дело завершено" : "Дело снова в работе");
      render();
    }

    function onClick(event) {
      const el = event.target.closest("[data-action], [data-nav]");
      if (!el) return;
      if (el.dataset.nav) {
        const dest = el.dataset.nav;
        if (dest === "add") openAdd(ui.view === "section" ? ui.section : "tasks", false);
        else go(dest);
        return;
      }
      const action = el.dataset.action;
      if (!action) return;
      if (action !== "ask-delete" && action !== "confirm-delete") ui.deleteId = null;
      if (action !== "money-ask" && action !== "money-delete") ui.moneyDeleteId = null;

      if (action === "voice-command") {
        if (commandListening) {
          stopVoice();
          renderVoice();
          return;
        }
        startCommandVoice();
        return;
      }
      if (action === "voice-yes") {
        if (!ui.voiceConfirm) return;
        const apply = ui.voiceConfirm.apply;
        ui.voiceConfirm = null;
        ui.dialog = null;
        stopVoice();
        const message = apply();
        save();
        finishMessage(message);
        return;
      }
      if (action === "voice-no" || action === "voice-cancel") {
        ui.dialog = null;
        ui.voiceConfirm = null;
        stopVoice();
        finishMessage("Хорошо, " + personName() + ", ничего не меняю.");
        return;
      }
      if (action === "voice-repeat") {
        const question = ui.voiceConfirm ? ui.voiceConfirm.text : (ui.dialog && ui.dialog.question);
        if (!question) return;
        stopVoice();
        speakThenListen(question);
        return;
      }
      if (action === "toggle-speak") {
        state.voiceSpeak = state.voiceSpeak === false;
        if (state.voiceSpeak === false) stopSpeaking();
        save();
        toast(state.voiceSpeak ? "Голосовые ответы включены" : "Голосовые ответы выключены");
        render();
        return;
      }
      if (action === "voice") {
        toggleVoice();
        return;
      }
      if (action === "go-home") return go("home");
      if (action === "go-holidays") return go("holidays");
      if (action === "go-assistant") return go("assistant");
      if (action === "go-add") return openAdd(el.dataset.section, el.dataset.focus === "1");
      if (action === "open-section") {
        ui.section = el.dataset.section || "tasks";
        return go("section");
      }
      if (action === "toggle") return toggleTask(el.dataset.id);
      if (action === "plan-day") {
        ui.planDate = el.dataset.date;
        render();
        return;
      }
      if (action === "pick-section") {
        readForm();
        ui.form.section = el.dataset.section;
        render();
        return;
      }
      if (action === "task-filter") {
        ui.taskFilter = el.dataset.filter;
        render();
        return;
      }
      if (action === "make-focus") {
        state.tasks.forEach(function (task) { task.focus = task.id === el.dataset.id; });
        save();
        toast("Фокус дня обновлён");
        render();
        return;
      }
      if (action === "ask-delete") {
        ui.deleteId = el.dataset.id;
        render();
        return;
      }
      if (action === "confirm-delete") {
        state.tasks = state.tasks.filter(function (task) { return task.id !== el.dataset.id; });
        ui.deleteId = null;
        save();
        toast("Дело удалено");
        render();
        return;
      }
      if (action === "next-focus") {
        const next = sortTasks(state.tasks.filter(function (task) { return !task.done; }))[0];
        if (!next) {
          toast("Открытых дел больше нет");
          return;
        }
        state.tasks.forEach(function (task) { task.focus = task.id === next.id; });
        save();
        toast("Новый фокус дня");
        render();
        return;
      }
      if (action === "water") {
        const goal = Number(state.health.waterGoal) || 8;
        state.health.water = Math.max(0, Math.min(goal, Number(state.health.water) + Number(el.dataset.delta || 0)));
        save();
        render();
        return;
      }
      if (action === "water-set") {
        const value = Number(el.dataset.value) || 0;
        const current = Number(state.health.water) || 0;
        state.health.water = current === value ? Math.max(0, value - 1) : value;
        state.health.waterGoal = 8;
        save();
        render();
        return;
      }
      if (action === "mood") {
        state.health.mood = el.dataset.mood;
        save();
        render();
        return;
      }
      if (action === "sleep") {
        let total = Number(state.health.sleepHours) * 60 + Number(state.health.sleepMinutes) + Number(el.dataset.delta || 0);
        total = Math.max(0, Math.min(14 * 60, total));
        state.health.sleepHours = Math.floor(total / 60);
        state.health.sleepMinutes = total % 60;
        save();
        render();
        return;
      }
      if (action === "steps") {
        state.health.steps = Math.max(0, Number(state.health.steps) + Number(el.dataset.delta || 0));
        save();
        render();
        return;
      }
      if (action === "money-ask") {
        ui.moneyDeleteId = el.dataset.id;
        render();
        return;
      }
      if (action === "money-delete") {
        const op = state.finance.ops.find(function (item) { return item.id === el.dataset.id; });
        ui.moneyDeleteId = null;
        if (!op) return;
        removeMoney(op);
        save();
        toast("Операция удалена");
        render();
        return;
      }
      if (action === "money-kind") {
        readMoneyForm();
        ui.moneyForm.kind = el.dataset.kind;
        render();
        return;
      }
      if (action === "goal-step") {
        const goal = state.goals.find(function (item) { return item.id === el.dataset.id; });
        if (!goal || goal.progress >= 100) return;
        goal.progress = Math.min(100, Number(goal.progress) + 10);
        if (goal.progress >= 100) goal.note = "цель достигнута";
        save();
        toast(goal.progress >= 100 ? "Цель достигнута" : "Шаг отмечен");
        render();
        return;
      }
      if (action === "holiday-info") {
        toast(el.dataset.name || "Праздник");
        return;
      }
      if (action === "doc-new") {
        ui.docOpen = true;
        ui.shouldFocus = true;
        render();
        return;
      }
      if (action === "doc-close") {
        readDocForm();
        ui.docOpen = false;
        render();
        return;
      }
      if (action === "doc-pdf") {
        const doc = letterPayload();
        if (!doc) {
          render();
          return;
        }
        storeLetter(doc);
        ui.docForm = { title: "", to: "", body: "", error: "" };
        ui.docOpen = false;
        toast("Документ сохранён");
        render();
        printLetter(doc);
        return;
      }
      if (action === "doc-print") {
        const doc = state.documents.find(function (item) { return item.id === el.dataset.id; });
        if (doc && doc.kind === "letter") printLetter(doc);
        return;
      }
      if (action === "doc-delete") {
        const doc = state.documents.find(function (item) { return item.id === el.dataset.id; });
        if (!doc || doc.kind !== "letter") return;
        if (!confirm("Удалить этот документ из браузера?")) return;
        state.documents = state.documents.filter(function (item) { return item.id !== doc.id; });
        save();
        toast("Документ удалён");
        render();
        return;
      }
      if (action === "assist-day") {
        ui.assistMode = "day";
        beginReply("Разбери мой день", function () { return { text: dayPlanText() }; });
        return;
      }
      if (action === "assist-letter") {
        if (ui.typing) {
          toast("Подождите, собираю ответ…");
          return;
        }
        captureAssist();
        ui.assistMode = "appeal";
        ui.appeal.error = "";
        render();
        return;
      }
      if (action === "assist-doc") {
        if (ui.typing) {
          toast("Подождите, собираю ответ…");
          return;
        }
        captureAssist();
        ui.assistMode = "explain";
        ui.explainError = "";
        render();
        return;
      }
      if (action === "save-chat-letter") {
        const msg = ui.chat[Number(el.dataset.index)];
        if (!msg || !msg.letter) return;
        storeLetter({
          id: uid(),
          title: msg.letter.title,
          to: msg.letter.to,
          body: msg.letter.body,
          meta: "обращение",
          status: "актуален",
          kind: "letter",
          created: todayIso()
        });
        toast("Обращение сохранено в документах");
        return;
      }
      if (action === "copy-chat") {
        const msg = ui.chat[Number(el.dataset.index)];
        if (msg) copyPlain(msg.text);
        return;
      }
      if (action === "doc-toggle") {
        const doc = state.documents.find(function (item) { return item.id === el.dataset.id; });
        if (!doc) return;
        if (doc.status === "внимание") {
          doc.status = "актуален";
          doc.meta = "проверено сегодня";
          toast("Документ отмечен");
        } else {
          doc.status = "внимание";
          doc.meta = "стоит проверить";
          toast("Документ отложен на проверку");
        }
        save();
        render();
        return;
      }
      if (action === "family-task") {
        const name = el.dataset.name || "близкому";
        const task = {
          id: uid(),
          title: "Позвонить: " + name,
          section: "family",
          date: todayIso(),
          time: timePlus(0),
          done: false,
          focus: false
        };
        state.tasks.push(task);
        ui.flashId = task.id;
        save();
        toast("Напоминание добавлено в дела");
        go("home");
        return;
      }
      if (action === "reset") {
        if (!confirm("Очистить все дела и заметки на этом устройстве?")) return;
        localStorage.removeItem(KEY);
        state = seed();
        save();
        toast("Данные очищены");
        go("home");
      }
    }

    function onSubmit(event) {
      event.preventDefault();
      if (event.target.id === "doc-form") {
        const doc = letterPayload();
        if (!doc) {
          render();
          return;
        }
        storeLetter(doc);
        ui.docForm = { title: "", to: "", body: "", error: "" };
        ui.docOpen = false;
        toast("Документ сохранён");
        render();
        return;
      }
      if (event.target.id === "appeal-form") {
        const data = new FormData(event.target);
        ui.appeal.to = String(data.get("to") || "");
        ui.appeal.topic = String(data.get("topic") || "");
        ui.appeal.essence = String(data.get("essence") || "");
        const to = ui.appeal.to.replace(/\s+/g, " ").trim();
        const topic = ui.appeal.topic.replace(/\s+/g, " ").trim();
        const essence = String(ui.appeal.essence || "").trim();
        if (!to || !topic || !essence) {
          ui.appeal.error = "Заполните, кому пишете, тему и суть обращения";
          render();
          return;
        }
        ui.appeal.error = "";
        const letter = { title: topic.slice(0, 140), to: to.slice(0, 140), body: essence.slice(0, 4000) };
        beginReply("Составь обращение: " + topic, function () {
          return { text: appealText(letter.to, letter.title, letter.body), letter: letter };
        });
        return;
      }
      if (event.target.id === "explain-form") {
        ui.explain = String(new FormData(event.target).get("source") || "");
        const text = ui.explain.trim();
        if (!text) {
          ui.explainError = "Вставьте текст документа";
          render();
          return;
        }
        ui.explainError = "";
        beginReply("Объясни документ простыми словами", function () {
          return { text: explainReply(text) };
        });
        return;
      }
      if (event.target.id === "name-form") {
        const data = new FormData(event.target);
        const name = String(data.get("person") || "").replace(/\s+/g, " ").trim();
        state.name = name || "Алексей";
        save();
        toast("Имя сохранено");
        render();
        return;
      }
      if (event.target.id === "add-form") {
        readForm();
        const title = ui.form.title.replace(/\s+/g, " ").trim();
        if (!title) {
          ui.form.error = "Напишите, что нужно сделать";
          render();
          return;
        }
        const task = {
          id: uid(),
          title: title.slice(0, 140),
          section: ui.form.section || "tasks",
          date: /^\d{4}-\d{2}-\d{2}$/.test(ui.form.date) ? ui.form.date : todayIso(),
          time: ui.form.time || "",
          done: false,
          focus: false
        };
        if (ui.form.focus) {
          state.tasks.forEach(function (item) { item.focus = false; });
          task.focus = true;
        }
        state.tasks.push(task);
        ui.flashId = task.id;
        ui.form = null;
        save();
        toast("Дело добавлено");
        ui.scrollTop = true;
        ui.view = "home";
        render();
        return;
      }
      if (event.target.id === "money-form") {
        readMoneyForm();
        const category = ui.moneyForm.category.replace(/\s+/g, " ").trim();
        const comment = ui.moneyForm.comment.replace(/\s+/g, " ").trim();
        const amount = Number(String(ui.moneyForm.amount).replace(/\s/g, "").replace(",", "."));
        if (!category) {
          ui.moneyForm.error = "Напишите категорию";
          render();
          return;
        }
        if (!amount || amount <= 0) {
          ui.moneyForm.error = "Укажите сумму больше нуля";
          render();
          return;
        }
        addMoney(ui.moneyForm.kind === "income" ? "income" : "expense", amount, category, comment);
        ui.moneyForm = { category: "", amount: "", comment: "", kind: ui.moneyForm.kind, error: "" };
        save();
        toast("Операция сохранена");
        render();
      }
    }

    document.getElementById("app").addEventListener("click", onClick);
    document.getElementById("nav").addEventListener("click", onClick);
    document.getElementById("voice").addEventListener("click", onClick);
    document.getElementById("app").addEventListener("submit", onSubmit);
    render();
    let shownDay = todayIso();
    setInterval(function () {
      const full = nowLine();
      const time = nowTimeText();
      document.querySelectorAll(".js-clock-full").forEach(function (el) {
        if (el.textContent !== full) el.textContent = full;
      });
      document.querySelectorAll(".js-clock-time").forEach(function (el) {
        if (el.textContent !== time) el.textContent = time;
      });
      const greet = greetingWord() + ", " + personName();
      document.querySelectorAll(".js-greet").forEach(function (el) {
        if (el.textContent !== greet) el.textContent = greet;
      });
      const day = todayIso();
      if (day !== shownDay) {
        shownDay = day;
        if (!document.getElementById("add-form") && !document.getElementById("money-form") && !document.getElementById("doc-form") && !document.getElementById("appeal-form") && !document.getElementById("explain-form") && !document.getElementById("name-form")) render();
      }
    }, 1000);
  </script>
</body>
</html>
