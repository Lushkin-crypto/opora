    function compressPhoto(file, done) {
      if (!file || String(file.type || "").indexOf("image/") !== 0) {
        toast("Выберите фотографию с устройства");
        return;
      }
      const reader = new FileReader();
      reader.onerror = function () { toast("Не получилось открыть фото. Выберите другое изображение."); };
      reader.onload = function () {
        const img = new Image();
        img.onload = function () {
          const maxSide = 1280;
          const scale = Math.min(1, maxSide / Math.max(img.width || 1, img.height || 1));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round((img.width || 1) * scale));
          canvas.height = Math.max(1, Math.round((img.height || 1) * scale));
          const ctx = canvas.getContext("2d");
          if (!ctx) {
            toast("Не получилось подготовить фото на этом устройстве");
            return;
          }
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          done(canvas.toDataURL("image/jpeg", 0.72));
        };
        img.onerror = function () { toast("Не получилось открыть фото. Выберите изображение поменьше."); };
        img.src = String(reader.result || "");
      };
      reader.readAsDataURL(file);
    }

        if (!data || !Array.isArray(data.tasks) || !data.health || typeof data.health !== "object" || !data.finance || typeof data.finance !== "object" || !Array.isArray(data.goals) || !Array.isArray(data.documents) || !Array.isArray(data.family)) return null;

    function readBackupFile(file) {
      const reader = new FileReader();
      reader.onload = function () {
        const data = backupFromText(String(reader.result || ""));
        if (!data) {
          ui.restoreData = null;
          ui.restoreAsk = false;
          ui.restoreError = "Этот файл не похож на резервную копию ОПОРЫ. Выберите файл, который сохранили кнопкой «Сохранить резервную копию».";
          render();
          return;
        }
        ui.restoreError = "";
        ui.restoreData = data;
        ui.restoreAsk = true;
        render();
      };
      reader.onerror = function () {
        ui.restoreData = null;
        ui.restoreAsk = false;
        ui.restoreError = "Не получилось прочитать файл. Выберите резервную копию ОПОРЫ ещё раз.";
        render();
      };
      reader.readAsText(file);
    }

    function downloadBackup() {
      const data = JSON.parse(JSON.stringify(state));
      if (data.backupPersonal !== true) data.personalDocs = [];
      const payload = { app: "opora", version: 1, exported: todayIso(), data: data };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.href = url;
      link.download = "opora-backup-" + todayIso() + ".json";
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    }

    function stopSpeaking() {
      speakToken += 1;
      if (!window.speechSynthesis) return;
      try { window.speechSynthesis.cancel(); } catch (error) { /* озвучка уже остановлена */ }
    }

    function haltRecognition() {
      listening = false;
      commandListening = false;
      const rec = recognizer;
      recognizer = null;
      if (!rec) return;
      rec.onresult = null;
      rec.onerror = null;
      rec.onend = null;
      try { rec.stop(); } catch (error) { /* распознавание уже остановлено */ }
    }

    function stopVoice() {
      haltRecognition();
      stopSpeaking();
    }

    function go(view) {
      if (view !== "add") stopVoice();
      if (view !== "assistant") {
        ui.typing = false;
        clearTimeout(assistTimer);
      }
      if (ui.view !== view) ui.scrollTop = true;
      ui.view = view;
      ui.deleteId = null;
      ui.familyDeleteId = null;
      render();
    }

    function toast(text) {
      const el = document.getElementById("toast");
      el.textContent = text;
      el.classList.add("show");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(function () { el.classList.remove("show"); }, 2400);
    }

    function openAdd(section, asFocus, date) {
      stopVoice();
      ui.voiceNote = "";
      ui.form = defaultForm(section || (ui.view === "section" ? ui.section : "tasks"), asFocus);
      if (/^\d{4}-\d{2}-\d{2}$/.test(String(date || ""))) ui.form.date = date;
      ui.shouldFocus = true;
      go("add");
    }

    function speechText(event) {
      let text = "";
      let isFinal = false;
      for (let i = 0; i < event.results.length; i += 1) {
        text += event.results[i][0].transcript;
        if (event.results[i].isFinal) isFinal = true;
      }
      return { text: text.replace(/\s+/g, " ").trim(), isFinal: isFinal };
    }

    function normCommand(value) {
      return String(value || "").toLowerCase().replace(/ё/g, "е").replace(/[^a-zа-я0-9\s]/gi, " ").replace(/\s+/g, " ").trim();
    }

    function parseAmountPrefix(text) {
      const raw = String(text || "").trim();
      const digit = raw.match(/^(\d{1,3}(?:\s\d{3})+|\d+)(?:[.,](\d+))?/);
        if (digit) {
        let value = Number(digit[1].replace(/\s/g, "") + (digit[2] ? "." + digit[2] : ""));
        let rest = raw.slice(digit[0].length).trim();
        if (/^тысяч/.test(rest)) {
          value *= 1000;
          rest = rest.replace(/^тысяч(?:а|и)?\s*/, "");
        }
        if (!value) return null;
        return { value: value, rest: rest };
      }
      const words = {
        ноль: 0, один: 1, одна: 1, одно: 1, два: 2, две: 2, три: 3, четыре: 4, пять: 5,
        шесть: 6, семь: 7, восемь: 8, девять: 9, десять: 10, одиннадцать: 11, двенадцать: 12,
        тринадцать: 13, четырнадцать: 14, пятнадцать: 15, шестнадцать: 16, семнадцать: 17,
        восемнадцать: 18, девятнадцать: 19, двадцать: 20, тридцать: 30, сорок: 40,
        пятьдесят: 50, шестьдесят: 60, семьдесят: 70, восемьдесят: 80, девяносто: 90,
        сто: 100, двести: 200, триста: 300, четыреста: 400, пятьсот: 500, шестьсот: 600,
        семьсот: 700, восемьсот: 800, девятьсот: 900
      };
      const parts = raw.split(" ");
      let total = 0;
      let current = 0;
      let saw = false;
      let used = 0;
      for (let i = 0; i < parts.length; i += 1) {
        const word = parts[i];
        if (word.indexOf("тысяч") === 0) {
          current = (current || 1) * 1000;
          total += current;
          current = 0;
          saw = true;
          used = i + 1;
          continue;
        }
        if (words[word] == null) break;
        current += words[word];
        saw = true;
        used = i + 1;
      }
      if (!saw) return null;
      return { value: total + current, rest: parts.slice(used).join(" ") };
    }

    function findTaskBySpeech(query) {
      const q = normCommand(query);
      if (q.length < 2) return null;
      let best = null;
      let score = 0;
      state.tasks.forEach(function (task) {
        const title = normCommand(task.title);
        let next = 0;
        if (title === q) next = 1000;
        else if (title.indexOf(q) !== -1) next = 200 + q.length;
        else if (q.indexOf(title) !== -1 && title.length > 2) next = 100 + title.length;
        if (next > score) {
          score = next;
          best = task;
        }
      });
      return best;
    }

    function findMoneyBySpeech(kind, query) {
      const q = normCommand(query);
      const ops = state.finance.ops.slice().reverse();
      return ops.find(function (op) {
        if (kind === "expense" && !(Number(op.amount) < 0)) return false;
        if (kind === "income" && !(Number(op.amount) > 0)) return false;
        const hay = normCommand((op.category || op.title || "") + " " + (op.comment || ""));
        return q && hay.indexOf(q) !== -1;
      }) || null;
    }

    function moodFromSpeech(words) {
      const w = normCommand(words);
      if (/отличн|прекрас/.test(w)) return "Отличное";
      if (/хорош|бодр/.test(w)) return "Хорошее";
      if (/нормальн|обычн|спокой/.test(w)) return "Нормальное";
      if (/неважн|так себе|устал|напряж/.test(w)) return "Неважное";
      if (/плох|тяжел/.test(w)) return "Плохое";
      return "";
    }

    function cleanSpeech(value) {
      return String(value || "").replace(/\s+/g, " ").trim();

    function capFirst(value) {

      return text
        .replace(/^(?:пожалуйста\s+)?(?:добавь|добавить|создай|создать|запиши|записать)\s+/, "")
        .replace(/^(?:ещё|еще|новую|новый|новое|нового|новая)\s+/, "")

    function deleteTail(text) {
      return text.replace(/^(?:удали|удалить|убери|убрать)\s+/, "").replace(/^в\s+/, "").trim();

    function matchKind(text) {
      const rules = [
        ["task", /^(?:задач(?:а|у|и|ей|е|ка|ку|ки)?|дело|дела)(?:\s+(.+))?$/],
        ["expense", /^расход(?:а|у|ом|е|ы)?(?:\s+(.+))?$/],
        ["income", /^доход(?:а|у|ом|е|ы)?(?:\s+(.+))?$/],
        ["document", /^документ(?:а|у|ом|е|ы|ов)?(?:\s+(.+))?$/],
        ["health", /^здоров(?:ье|ья|ью|ьем)?(?:\s+(.+))?$/],
        ["goal", /^цел(?:ь|и|ью|ям|ями|ях|ей)?(?:\s+(.+))?$/],
        ["family", /^сем(?:ья|ью|ье|ьи|ей)(?:\s+(.+))?$/]
      ];
      for (let i = 0; i < rules.length; i += 1) {
        const found = text.match(rules[i][1]);
        if (found) return { kind: rules[i][0], rest: cleanSpeech(found[1] || "") };
      }
      return null;
    }

    function spokenRest(raw, rest) {
      if (!rest) return "";
      const words = cleanSpeech(raw).split(" ");
      const count = rest.split(" ").length;
      if (words.length >= count) return words.slice(words.length - count).join(" ");
      return rest;
    }

    function russianVoice() {
      if (!window.speechSynthesis) return null;
      const list = window.speechSynthesis.getVoices() || [];
      for (let i = 0; i < list.length; i += 1) {
        if (/^ru([-_]|$)/i.test(list[i].lang || "")) return list[i];
      }
      return null;
    }

    function speak(text, then) {
      if (!text) {
        if (then) then();
        return;
      }
      if (state.voiceSpeak === false || !window.speechSynthesis || typeof window.SpeechSynthesisUtterance !== "function") {
        if (then) then();
        return;
      }
      stopSpeaking();
      const token = speakToken;
      const queued = Date.now();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "ru-RU";
      const voice = russianVoice();
      if (voice) utter.voice = voice;
      let started = 0;
      utter.onstart = function () { started = Date.now(); };
      const finish = function () {
        if (token !== speakToken) return;
        if (started && Date.now() - started < 280) return;
        if (!started && Date.now() - queued < 280) return;
        if (then) then();
      };
      utter.onend = finish;
      utter.onerror = function () {
        if (token !== speakToken) return;
        if (then) then();
      };
      setTimeout(function () {
        if (token !== speakToken) return;
        try {
          window.speechSynthesis.resume();
          window.speechSynthesis.speak(utter);
        } catch (error) {
          if (then) then();
        }
      }, 40);
    }

    function vary(key, options) {
      const last = lineMemory[key];
      let index = Math.floor(Math.random() * options.length);
      if (options.length > 1 && index === last) index = (index + 1) % options.length;
      lineMemory[key] = index;
      return options[index];
    }

    function moneyFromSpeech(text) {
      let raw = normCommand(text);
      raw = raw.replace(/^(?:добавь|добавить|запиши|создай|сделай)\s+/, "");
      raw = raw.replace(/^(?:я\s+)?(?:потратил[аи]?|купил[аи]?|получил[аи]?|заработал[аи]?|пришли\s+деньги)\s+/, "");
      raw = raw.replace(/^(?:расход|доход)(?:а|у|ом|е|ы)?\s+/, "");
      raw = raw.replace(/^(?:на|в|за)\s+/, "");
      const amount = parseAmountPrefix(raw);
      if (!amount || !amount.value) return null;
      let rest = amount.rest.replace(/^(?:рублей|рубля|рубль|руб)\s+/, "");
      rest = rest.replace(/^(?:на|за)\s+/, "");
      rest = rest.replace(/^(?:категория|категорию)\s+/, "").replace(/[.,]$/, "").trim();
      let comment = "";
      const parts = rest.split(/\s+комментарий\s+/);
      if (parts.length > 1) {
        rest = parts[0].trim();
        comment = parts.slice(1).join(" ");
      }
      return { value: amount.value, category: capFirst(rest), comment: comment };
    }

        "Понял вас. Записал самочувствие: " + next + ".",
        "Готово, " + name + ". Самочувствие на сегодня: " + next + "."
      ]));
    }

    function glassesIn(text) {
      const word = text.match(/(\d+|один|одну|одна|два|две|три|четыре|пять|пару)\s+стакан/);
      if (word) {
        const map = { один: 1, одну: 1, одна: 1, два: 2, две: 2, три: 3, четыре: 4, пять: 5, пару: 2 };
        return Math.max(1, Math.min(8, map[word[1]] || Number(word[1]) || 1));
      }
      if (/стакан/.test(text) || /выпил/.test(text) || text === "вода" || text === "воду" || text === "воды" || text === "выпил воды") return 1;
      return 0;
    }

    function applyKnownHealth(text) {
      if (!/шаг|сон|спал|самочувств|задач/.test(text)) {
        const glasses = glassesIn(text);
        if (glasses && /вод|стакан|выпил/.test(text)) {
          applyWater(glasses);
          return true;
        }
      }
      if (text.indexOf("задач") === -1 && /шаг/.test(text)) {
        const steps = text.match(/^(?:я\s+)?(?:добавь|добавить|прошел|прошла|прошли)?\s*(.+?)\s+шаг(?:ов|а|и)?$/);
        if (steps && parseAmountPrefix(steps[1].replace(/^(?:прошел|прошла|прошли)\s+/, ""))) {
          applySteps(text, false);
          return true;
        }
      }
      if (/^сон\s+\S/.test(text)) {
        applySleep(text.replace(/^сон\s+/, ""), false);
        return true;
      }
      if (/^(?:я\s+)?спал[аи]?\s+\S/.test(text)) {
        applySleep(text.replace(/^(?:я\s+)?спал[аи]?\s+/, ""), false);
        return true;
      }
      const mood = text.match(/^самочувствие\s+(.+)$/);
      if (mood) {
        applyMood(mood[1], false);
        return true;
      }
      return false;
    }

    function confirmFoundTask(query) {
      const name = personName();
      const task = findTaskBySpeech(query);
      if (!task) {
        ask("delete-task", name + ", не нашёл такую задачу. Назовите название ещё раз.");
        return;
      }
      askDelete(confirmLine(task.title), function () {
        state.tasks = state.tasks.filter(function (item) { return item.id !== task.id; });
        return vary("task-del", [
          name + ", задача «" + task.title + "» удалена.",
          "Готово. «" + task.title + "» больше не в списке.",
          "Убрал это дело, " + name + "."
        ]);
      });
    }

    function confirmFoundMoney(kind, query) {
      const name = personName();
      const op = findMoneyBySpeech(kind, query);
      const step = kind === "income" ? "delete-income" : "delete-expense";
      const what = kind === "income" ? "доход" : "расход";
      if (!op) {
        ask(step, name + ", не нашёл такой " + what + ". Назовите ещё раз.");
        return;
      }
      const label = op.category || op.title;
      askDelete(confirmLine(what + " " + label), function () {
        removeMoney(op);
        return name + ", " + what + " «" + label + "» удалён. Баланс месяца: " + signedMoney(monthBalance()) + ".";
      });
    }

    function beginAdd(kind, raw) {
      const name = personName();
      const matched = matchKind(sectionTail(normCommand(raw)));
      const rest = matched ? matched.rest : "";
      const said = spokenRest(raw, rest);
      if (kind === "task") {
        if (said) addTaskTitle(said);
        else ask("task-title", name + ", какую задачу добавить?");
        return;
      }
      if (kind === "expense") {
        if (rest) takeMoney("expense", rest);
        else ask("expense", name + ", назови сумму и на что потратил.");
        return;
      }
      if (kind === "income") {
        if (rest) takeMoney("income", rest);
        else ask("income", name + ", назови сумму и источник дохода.");
        return;
      }
      if (kind === "document") {
        if (said) ask("doc-to", name + ", кому адресован документ?", { title: said.slice(0, 140) });
        else ask("doc-title", name + ", как назвать документ?", {});
        return;
      }
      if (kind === "health") {
        if (rest && applyKnownHealth(rest)) return;
        ask("health-pick", name + ", что добавить: воду, шаги, сон или самочувствие?");
        return;
      }
      if (kind === "goal") {
        if (said) addGoalTitle(said);
        else ask("goal-title", name + ", какую цель добавить?");
        return;
      }
      if (said) ask("family-role", name + ", кем приходится " + said + "?", { name: capFirst(said).slice(0, 40) });
      else ask("family-name", name + ", кого добавить в семью?", {});
    }

    function healthKindFromSpeech(text) {
      const value = normCommand(text);
      if (/лекар/.test(value)) return "medicine";
      if (/процед/.test(value)) return "procedure";
      if (/измер/.test(value)) return "measure";
      if (/друг/.test(value)) return "other";
      return "";
    }

    function parseClockSpeech(text) {
      const value = normCommand(text);
      let match = value.match(/(\d{1,2})\s+(\d{2})(?!\d)/);
      if (match) return formatTime(match[1] + ":" + match[2]);
      match = value.match(/(\d{1,2})\s*час/);
      if (match) {
        const minutes = value.match(/(\d{1,2})\s*мин/);
        return formatTime(match[1] + ":" + (minutes ? minutes[1] : "00"));
      }
      match = value.match(/^(\d{1,2})$/);
      if (match) return formatTime(match[1] + ":00");
      return "";
    }

    function parseHealthDays(text) {
      const value = normCommand(text);
      if (/каждый\s+день|ежеднев|все\s+дни|всю\s+недел/.test(value)) return { freq: "daily", days: [] };
      if (/будн/.test(value)) return { freq: "days", days: [1, 2, 3, 4, 5] };
      if (/выходн/.test(value)) return { freq: "days", days: [6, 7] };
      const words = [
        ["понедельник", 1], ["вторник", 2], ["среда", 3], ["среду", 3], ["четверг", 4],
        ["пятница", 5], ["пятницу", 5], ["суббота", 6], ["субботу", 6], ["воскресенье", 7],
        ["пн", 1], ["вт", 2], ["ср", 3], ["чт", 4], ["пт", 5], ["сб", 6], ["вс", 7]
      ];
      const found = [];
      words.forEach(function (pair) {
        const re = new RegExp("(^|\\s)" + pair[0] + "(\\s|$)");
        if (re.test(value) && found.indexOf(pair[1]) === -1) found.push(pair[1]);
      });
      if (!found.length) return null;
      found.sort(function (a, b) { return a - b; });
      return { freq: "days", days: found };
    }

    function beginHealthReminder() {
      ask("health-remind-title", personName() + ", как назвать напоминание?");
    }

    function finishHealthReminder(draft) {
      const name = personName();
      const item = {
        id: uid(),
        title: cleanSpeech(draft.title || ""),
        kind: draft.kind || "other",
        time: draft.time,
        freq: draft.freq === "days" ? "days" : "daily",
        days: draft.days || [],
        note: cleanSpeech(draft.note || ""),
        doneOn: {}
      };
      normalizeHealthReminder(item);
      if (!Array.isArray(state.healthReminders)) state.healthReminders = [];
      state.healthReminders.push(item);
      save();
      const when = item.freq === "daily" ? "каждый день" : healthDaysLabel(item);
      finishMessage(vary("health-remind", [
        name + ", записал. «" + item.title + "», " + when + " в " + item.time + ".",
        "Готово. Напомню про «" + item.title + "» " + when + " в " + item.time + ".",
        "Хорошо, " + name + ". «" + item.title + "» стоит в " + item.time + ", " + when + "."
      ]));
    }

    function handleDialog(raw) {
      const text = normCommand(raw);
      const name = personName();
      const step = ui.dialog.step;
      const draft = ui.dialog.draft || {};
      if (step === "health-remind-title") {
        const title = cleanSpeech(raw).slice(0, 80);
        if (!title) {
          ask("health-remind-title", name + ", как назвать напоминание?", draft);
          return true;
        }
        ask("health-remind-kind", name + ", это лекарство, процедура, измерение или другое?", { title: title });
        return true;
      }
      if (step === "health-remind-kind") {
        const kind = healthKindFromSpeech(text);
        if (!kind) {
          ask("health-remind-kind", name + ", выберите тип: лекарство, процедура, измерение или другое.", draft);
          return true;
        }
        draft.kind = kind;
        ask("health-remind-time", name + ", во сколько напомнить? Например, 08:30.", draft);
        return true;
      }
      if (step === "health-remind-time") {
        const time = parseClockSpeech(text);
        if (!time) {
          ask("health-remind-time", name + ", не разобрал время. Скажите, например, 08:30.", draft);
          return true;
        }
        draft.time = time;
        ask("health-remind-days", name + ", каждый день или в какие дни? Например: пн, ср, пт.", draft);
        return true;
      }
      if (step === "health-remind-days") {
        const days = parseHealthDays(text);
        if (!days) {
          ask("health-remind-days", name + ", скажите «каждый день» или дни: пн, ср, пт.", draft);
          return true;
        }
        draft.freq = days.freq;
        draft.days = days.days;
        ask("health-remind-note", name + ", нужна короткая заметка? Можно сказать «нет».", draft);
        return true;
      }
      if (step === "health-remind-note") {
        draft.note = isNo(text) || /без заметки|пропусти/.test(text) ? "" : cleanSpeech(raw).slice(0, 140);
        finishHealthReminder(draft);
        return true;
      }
      if (step === "add-pick") {
        if (applyGoalVoice(text)) return true;
        if (applyKnownHealth(text)) return true;
        const money = moneyLead(text);
        if (money) {
          if (money.body) takeMoney(money.kind, money.body);
          else beginAdd(money.kind, money.kind === "income" ? "доход" : "расход");
          return true;
        }
        const kind = matchKind(sectionTail(text));
        if (!kind) return false;
        beginAdd(kind.kind, raw);
        return true;
      }
      if (step === "task-title") {
        addTaskTitle(cleanSpeech(raw));
        return true;
      }
      if (step === "expense") {
        takeMoney("expense", text);
        return true;
      }
      if (step === "income") {
        takeMoney("income", text);
        return true;
      }
      if (step === "doc-title") {
        const title = cleanSpeech(raw).slice(0, 140);
        if (!title) {
          ask("doc-title", name + ", как назвать документ?", {});
          return true;
        }
        ask("doc-to", name + ", кому адресован документ?", { title: title });
        return true;
      }
      if (step === "doc-to") {
        const to = cleanSpeech(raw).slice(0, 140);
        if (!to) {
          ask("doc-to", name + ", кому адресован документ?", draft);
          return true;
        }
        ask("doc-body", name + ", продиктуйте текст документа.", { title: draft.title, to: to });
        return true;
      }
      if (step === "doc-body") {
        const body = cleanSpeech(raw).slice(0, 8000);
        if (!body) {
          ask("doc-body", name + ", продиктуйте текст документа.", draft);
          return true;
        }
        storeLetter({
          id: uid(),
          title: draft.title || "Черновик",
          to: draft.to || "",
          body: body,
          meta: "черновик",
          status: "актуален",
          kind: "letter",
          created: todayIso()
        });
        finishMessage(vary("doc", [
          name + ", черновик документа сохранён.",
          "Готово. Черновик документа сохранён: «" + (draft.title || "без названия") + "».",
          "Записал обращение, " + name + ". Черновик документа сохранён."
        ]));
        return true;
      }
      if (step === "goal-title") {
        addGoalTitle(cleanSpeech(raw));
        return true;
      }
      if (step === "habit-title") {
        addHabitTitle(cleanSpeech(raw));
        return true;
      }
      if (step === "family-name") {
        const person = capFirst(cleanSpeech(raw)).slice(0, 40);
        if (!person) {
          ask("family-name", name + ", кого добавить в семью?", {});
          return true;
        }
        ask("family-role", name + ", кем приходится " + person + "?", { name: person });
        return true;
      }
      if (step === "family-role") {
        const role = cleanSpeech(raw).slice(0, 40);
        if (!role) {
          ask("family-role", name + ", кем приходится " + (draft.name || "этот человек") + "?", draft);
          return true;
        }
        state.family.push({ id: uid(), name: draft.name || "Близкий", role: role, note: "", born: "", remind: "day" });
        save();
        finishMessage(vary("family", [
          name + ", добавил в семью: " + (draft.name || "близкий") + ", " + role + ".",
          "Готово. " + (draft.name || "Близкий") + " теперь в семье.",
          "Запомнил, " + name + ". " + (draft.name || "Этот человек") + " — " + role + "."
        ]));
        return true;
      }
      if (step === "health-pick") {
        if (applyKnownHealth(text)) return true;
        if (/^вод/.test(text)) {
          applyWater();
          return true;
        }
        if (/^шаг/.test(text)) {
          const inline = text.match(/^шаг(?:ов|а|и)?\s+(.+)$/);
          if (inline) applySteps(inline[1], true);
          else ask("health-steps", name + ", сколько шагов добавить?");
          return true;
        }
        if (text === "сон") {
          ask("health-sleep", name + ", сколько вы спали? Например: 7 часов 30 минут.");
          return true;
        }
        if (/^сон\s+/.test(text) || /час/.test(text)) {
          applySleep(text.replace(/^сон\s+/, ""), true);
          return true;
        }
        if (/^самочувств/.test(text)) {
          const mood = text.replace(/^самочувствие\s+/, "");
          if (mood) applyMood(mood, true);
          else ask("health-mood", name + ", какое самочувствие: отличное, хорошее, нормальное, неважное или плохое?");
          return true;
        }
        if (moodFromSpeech(text)) {
          applyMood(text, true);
          return true;
        }
        return false;
      }
      if (step === "health-steps") {
        applySteps(text, true);
        return true;
      }
      if (step === "health-sleep") {
        applySleep(text.replace(/^сон\s+/, ""), true);
        return true;
      }
      if (step === "health-mood") {
        applyMood(text.replace(/^самочувствие\s+/, ""), true);
        return true;
      }
      if (step === "delete-pick") {
        const kind = matchKind(sectionTail(deleteTail(text)));
        if (!kind || (kind.kind !== "task" && kind.kind !== "expense" && kind.kind !== "income")) return false;
        if (kind.kind === "task") {
          if (kind.rest) confirmFoundTask(kind.rest);
          else ask("delete-task", name + ", какую задачу удалить?");
          return true;
        }
        if (kind.kind === "expense") {
          if (kind.rest) confirmFoundMoney("expense", kind.rest);
          else ask("delete-expense", name + ", какой расход удалить? Назовите категорию.");
          return true;
        }
        if (kind.rest) confirmFoundMoney("income", kind.rest);
        else ask("delete-income", name + ", какой доход удалить? Назовите источник.");
        return true;
      }
      if (step === "done-task") {
        completeTask(text);
        return true;
      }
      if (step === "delete-task") {
        confirmFoundTask(text);
        return true;
      }
      if (step === "delete-expense") {
        confirmFoundMoney("expense", text);
        return true;
      }
      if (step === "delete-income") {
        confirmFoundMoney("income", text);
        return true;
      }
      if (step === "fe-who" || step === "fe-date" || step === "fe-time") {
        fillFamilyAnswer(step, text, draft);
        return true;
      }
      if (step === "fe-invite") {
        const role = inviteRoleFromSpeech(text);
        if (!role) {
          ask("fe-invite", name + ", кого пригласить: сына, дочь, супруга, родителя или близкого?", draft);
          return true;
        }
        createFamilyInvite(role, true);
        return true;
      }
      return false;
    }

    function handleConfirm(text) {
      if (!ui.voiceConfirm) return false;
      if (isYes(text)) {
        const apply = ui.voiceConfirm.apply;
        ui.voiceConfirm = null;
        ui.dialog = null;
        const message = apply();
        save();
        finishMessage(message);
        return true;
      }
      if (isNo(text)) {
        ui.voiceConfirm = null;
        ui.dialog = null;
        finishMessage("Хорошо, " + personName() + ", ничего не меняю.");
        return true;
      }
      ui.voiceConfirm = null;
      return false;
    }

    function moneyLead(text) {
      let found = text.match(/^(?:я\s+)?(?:потратил[аи]?|купил[аи]?(?:\s+за)?|расход(?:а|у|ом|е|ы)?)(?:\s+(.*))?$/);
      if (found) return { kind: "expense", body: cleanSpeech(found[1] || "") };
      found = text.match(/^(?:я\s+)?(?:получил[аи]?|заработал[аи]?|доход(?:а|у|ом|е|ы)?|пришли\s+деньги)(?:\s+(.*))?$/);
      if (found) return { kind: "income", body: cleanSpeech(found[1] || "") };
      return null;
    }

    function completeTask(query) {
      const name = personName();
      const task = findTaskBySpeech(query);
      if (!task) finishMessage(vary("task-miss", [
        name + ", не нашёл такую задачу.",
        "Не вижу такого дела. Назовите его чуть точнее."
      ]));
      else if (!repeatKey(task.repeat) && task.done) finishMessage(name + ", задача «" + task.title + "» уже выполнена.");
      else if (repeatKey(task.repeat) && taskOccursOn(task, todayIso()) && taskDoneOn(task, todayIso())) finishMessage(name + ", на сегодня «" + task.title + "» уже отмечена. В следующие дни она останется.");
      else {
        if (repeatKey(task.repeat)) {
          const iso = taskOccursOn(task, todayIso()) ? todayIso() : task.date;
          if (!task.doneOn || typeof task.doneOn !== "object" || Array.isArray(task.doneOn)) task.doneOn = {};
          task.doneOn[iso] = true;
        } else task.done = true;
        save();
        finishMessage(vary("task-done", [
          "Отметил готовым: «" + task.title + "».",
          name + ", задача «" + task.title + "» выполнена. Хороший шаг.",
          "Сделано. «" + task.title + "» можно отпустить."
        ]));
      }
    }

    function planTasks(todayOnly) {
      return state.tasks.filter(function (task) {
        if (todayOnly) return taskOccursOn(task, todayIso()) && !taskDoneOn(task, todayIso());
        return !task.done;
      }).sort(function (a, b) {
        if (!!a.focus !== !!b.focus) return a.focus ? -1 : 1;
        return String(a.time || "").localeCompare(String(b.time || ""));
      });
    }

    function sayPlan(todayOnly) {
      const name = personName();
      const list = planTasks(todayOnly);
      if (!list.length) {
        finishMessage(todayOnly
          ? "На сегодня пока нет задач. Хотите добавить первую?"
          : name + ", открытых задач пока нет. Хотите добавить первую?");
        return;
      }
      const n = list.length;
      const scope = todayOnly ? "на сегодня" : "в открытых делах";
      const head = vary("day-head", [
        name + ", " + scope + " у вас " + n + " " + plural(n, "дело", "дела", "дел") + ".",
        "Смотрю список, " + name + ". " + capFirst(scope) + " открыто " + n + " " + plural(n, "дело", "дела", "дел") + ".",
        todayOnly && n === 3 ? "На сегодня у вас три дела." : "Вот что ещё ждёт, " + name + ": " + n + " " + plural(n, "дело", "дела", "дел") + "."
      ]);
      const lines = list.slice(0, 8).map(function (task, index) { return (index + 1) + ". " + task.title; });
      const tail = vary("day-tail", ["С чего начнём?", "Добавим ещё что-нибудь?", "Начнём с самого важного?"]);
      finishMessage(head + "\n" + lines.join("\n") + "\n" + tail);
    }

    function applyFinanceSpeech(text) {
      const name = personName();
      if (/сколько/.test(text) && /потрат/.test(text) && /месяц/.test(text)) {
        const spent = monthSpent();
        const budget = Number(state.finance.budget) || 0;
        let line = name + ", в этом месяце расходы: " + rub(spent) + ".";
        if (budget) {
          const left = budget - spent;
          line += left >= 0 ? " Осталось " + rub(left) + "." : " Лимит превышен на " + rub(Math.abs(left)) + ".";
        }
        finishMessage(line);
        return true;
      }
      const set = text.match(/^(?:установи|установить|поставь|поставить|задай|задать)\s+бюджет(?:\s+на\s+месяц)?\s+(.+)$/);
      if (!set) return false;
      const amount = parseAmountPrefix(set[1]);
      if (!amount || !amount.value) {
        finishMessage(name + ", какую сумму бюджета поставить? Например: 50000 рублей.");
        return true;
      }
      state.finance.budget = Math.round(amount.value);
      save();
      finishMessage(name + ", бюджет месяца — " + rub(state.finance.budget) + ". Уже потрачено: " + rub(monthSpent()) + ".");
      return true;
    }

    function applyDocSpeech(text) {
      const name = personName();
      if (/^добав(?:ь|ить)\s+паспорт/.test(text)) {
        openPersonalVoice("passport");
        return true;
      }
      if (/^добав(?:ь|ить)\s+снилс/.test(text)) {
        openPersonalVoice("snils");
        return true;
      }
      if (/^добав(?:ь|ить)\s+личн/.test(text)) {
        openPersonalVoice("other");
        return true;
      }
      if (/покажи\s+(?:мои\s+)?документ/.test(text)) {
        ui.view = "section";
        ui.section = "documents";
        ui.docTab = "papers";
        ui.scrollTop = true;
        const titles = state.documents.map(function (doc) { return doc.title; }).filter(Boolean).slice(0, 8);
        let line = titles.length ? name + ", ваши документы: " + titles.join(", ") + "." : name + ", обычных документов пока нет.";
        const count = (state.personalDocs || []).length;
        if (count) line += " Личных документов: " + count + ". Номера я не называю.";
        finishMessage(line);
        return true;
      }
      return false;
    }

    function openPersonalVoice(type) {
      const name = personName();
      ui.view = "section";
      ui.section = "documents";
      ui.docTab = "personal";
      ui.scrollTop = true;
      ui.personalReveal = "";
      ui.photoId = "";
      if (state.personalReady !== true) {
        ui.personalForm = null;
        finishMessage(name + ", сначала прочитайте предупреждение о личных документах. Номера вслух я не повторяю.");
        return;
      }
      ui.personalForm = blankPersonal(type);
      ui.shouldFocus = true;
      finishMessage(name + ", форма открыта. Впишите данные на экране: номера вслух я не называю.");
    }

    const FAMILY_ROLE_STEMS = [
      [/сыно|сын/, "сын"],
      [/дочер|дочк|доч/, "дочь"],
      [/мам/, "мама"],
      [/пап/, "папа"],
      [/жен/, "жена"],
      [/муж/, "муж"],
      [/супруг/, "супруг"],
      [/бабуш/, "бабушка"],
      [/дедуш/, "дедушка"],
      [/брат/, "брат"],
      [/сестр/, "сестра"]
    ];

    function roleMentioned(text) {
      return FAMILY_ROLE_STEMS.some(function (item) { return item[0].test(text); });
    }

    function eventWords(text) {
      if (/секц|круж/.test(text)) return { type: "club", title: "Секция" };
      if (/школ/.test(text)) return { type: "school", title: "Школа" };
      if (/работ/.test(text)) return { type: "work", title: "Работа" };
      if (/встреч/.test(text)) return { type: "meeting", title: "Встреча" };
      if (/врач|поликлин|больниц/.test(text)) return { type: "doctor", title: "Врач" };
      if (/семейн/.test(text)) return { type: "home", title: "Семейное дело" };
      return null;
    }

    function spokenDate(text) {
      if (/сегодня/.test(text)) return todayIso();
      if (/послезавтра/.test(text)) return shiftIso(todayIso(), 2);
      if (/завтра/.test(text)) return shiftIso(todayIso(), 1);
      const weeks = [["понедельник", 1], ["вторник", 2], ["сред", 3], ["четверг", 4], ["пятниц", 5], ["суббот", 6], ["воскресень", 0]];
      for (let i = 0; i < weeks.length; i += 1) {
        if (text.indexOf(weeks[i][0]) === -1) continue;
        const delta = (weeks[i][1] - new Date().getDay() + 7) % 7;
        return shiftIso(todayIso(), delta);
      }
      const months = ["январ", "феврал", "март", "апрел", "мая", "июн", "июл", "август", "сентябр", "октябр", "ноябр", "декабр"];
      const found = text.match(/(\d{1,2})\s+([а-я]+)/);
      if (!found) return "";
      const day = Number(found[1]);
      const month = months.findIndex(function (stem) { return found[2].indexOf(stem) === 0; });
      if (month < 0 || day < 1 || day > 31) return "";
      let year = new Date().getFullYear();
      if (isoDate(new Date(year, month, day)) < todayIso()) year += 1;
      const date = new Date(year, month, day);
      if (date.getMonth() !== month || date.getDate() !== day) return "";
      return isoDate(date);
    }

    function spokenClock(text) {
      const pair = text.match(/(?:^|\s)(?:в\s+|на\s+|к\s+)?(\d{1,2})\s+(\d{2})(?!\d)/);
      if (pair) {
        const hour = Number(pair[1]);
        const minute = Number(pair[2]);
        if (hour <= 23 && minute <= 59) return String(hour).padStart(2, "0") + ":" + String(minute).padStart(2, "0");
      }
      const hourOnly = text.match(/(?:в|на|к)\s+(\d{1,2})(?!\d)/);
      if (!hourOnly) return "";
      const hour = Number(hourOnly[1]);
      if (hour > 23) return "";
      return String(hour).padStart(2, "0") + ":00";
    }

    function matchFamilyPeople(text) {
      const people = state.family || [];
      const byName = people.filter(function (person) {
        const name = normCommand(person && person.name);
        if (name.length < 2) return false;
        return text.split(" ").some(function (word) {
          return word === name || (name.length >= 3 && word.indexOf(name) === 0);
        });
      });
      if (byName.length) return byName;
      let stem = "";
      for (let i = 0; i < FAMILY_ROLE_STEMS.length; i += 1) {
        if (FAMILY_ROLE_STEMS[i][0].test(text)) { stem = FAMILY_ROLE_STEMS[i][1]; break; }
      }
      if (!stem) return [];
      const head = stem.slice(0, 3);
      return people.filter(function (person) {
        const role = normCommand(person && person.role);
        if (role.indexOf(head) !== -1) return true;
        return (stem === "сын" || stem === "дочь") && (role.indexOf("ребенок") !== -1 || role.indexOf("дет") !== -1);
      });
    }

    function familyEventIntent(text) {
      if (/как(?:ие|ое)|что за|покажи|есть ли/.test(text) && /событи/.test(text) && /семь/.test(text)) return "list";
      const kind = eventWords(text);
      const kin = roleMentioned(text) || (state.family || []).some(function (person) {
        const name = normCommand(person && person.name);
        return name.length >= 2 && text.indexOf(name) !== -1;
      });
      if (/секц|круж/.test(text) && /^(?:добавь|добавить|напомни|напомнить)/.test(text)) return "add";
      if (kind && kin) return "add";
      if (/^(?:добавь|добавить|напомни|напомнить)/.test(text) && kin && /событи|семейн[а-я]*\s+дел|(?:^|\s)дело(?:\s|$)/.test(text)) return "add";
      return "";
    }

    function absorbFamilyBits(draft, text) {
      const words = eventWords(text);
      if (words) {
        if (!draft.type || draft.type === "other") draft.type = words.type;
        if (!draft.title || draft.title === "Семейное событие") draft.title = words.title;
      }
      const people = matchFamilyPeople(text);
      if (!draft.personId && people.length === 1) draft.personId = people[0].id;
      const date = spokenDate(text);
      if (!draft.date && date) draft.date = date;
      const clock = spokenClock(text);
      if (!draft.time && clock) draft.time = clock;
      return people;
    }

    function storeSpokenFamilyEvent(draft) {
      const event = {
        id: uid(),
        title: String(draft.title || "Семейное событие").slice(0, 80),
        personId: draft.personId,
        type: familyEventType(draft.type),
        date: draft.date,
        time: formatTime(draft.time),
        remind: leadKey(draft.remind, "30"),
        note: "",
        status: "planned"
      };
      state.familyEvents.push(event);
      save();
      const who = familyPersonName(event.personId);
      const when = dayTitle(event.date).toLowerCase();
      finishMessage(personName() + ", записал: " + event.title + " для " + who + " " + when + " в " + event.time + ". Напомню " + remindLabel(event.remind).toLowerCase() + ".");
    }

    function continueFamilyDraft(draft) {
      const name = personName();
      if (!draft.personId) {
        const names = (state.family || []).map(function (person) { return person.name; }).filter(Boolean);
        ask("fe-who", name + ", для кого это событие" + (names.length ? ": " + names.join(", ") + "?" : "?"), draft);
        return;
      }
      if (!draft.date) {
        ask("fe-date", name + ", на какой день? Например: завтра.", draft);
        return;
      }
      if (!formatTime(draft.time)) {
        ask("fe-time", name + ", во сколько? Например: 17:00.", draft);
        return;
      }
      storeSpokenFamilyEvent(draft);
    }

    function startFamilyEvent(text) {
      const name = personName();
      if (!(state.family || []).length) {
        finishMessage(name + ", сначала добавьте близкого в разделе «Семья».");
        return;
      }
      const words = eventWords(text) || { type: "other", title: "Семейное событие" };
      const draft = { title: words.title, type: words.type, personId: "", date: spokenDate(text), time: spokenClock(text), remind: "30", note: "" };
      const matched = matchFamilyPeople(text);
      if (matched.length === 1) draft.personId = matched[0].id;
      if (matched.length > 1) {
        ask("fe-who", name + ", кого выбрать: " + matched.map(function (person) { return person.name; }).join(" или ") + "?", draft);
        return;
      }
      if (!matched.length && roleMentioned(text)) {
        finishMessage(name + ", в семье нет такого близкого. Добавьте его в разделе «Семья».");
        return;
      }
      continueFamilyDraft(draft);
    }

    function sayFamilyEvents(text) {
      const name = personName();
      const iso = spokenDate(text) || todayIso();
      const list = familyEventsOn(iso).filter(function (item) { return item.status === "planned"; });
      const when = iso === todayIso() ? "сегодня" : dayTitle(iso).toLowerCase();
      if (!list.length) {
        finishMessage(name + ", " + when + " семейных событий нет.");
        return;
      }
      const bits = list.map(function (item) {
        return familyPersonName(item.personId) + " — " + (item.title || "событие") + (formatTime(item.time) ? " в " + formatTime(item.time) : "");
      });
      finishMessage(name + ", " + when + ": " + bits.join(". ") + ".");
    }

    function fillFamilyAnswer(step, text, draft) {
      const next = draft || {};
      if (step === "fe-who") {
        const matched = matchFamilyPeople(text);
        if (matched.length === 1) next.personId = matched[0].id;
        else if (matched.length > 1) {
          ask("fe-who", personName() + ", кого выбрать: " + matched.map(function (person) { return person.name; }).join(" или ") + "?", next);
          return;
        } else {
          const names = (state.family || []).map(function (person) { return person.name; }).filter(Boolean);
          ask("fe-who", personName() + ", не разобрал имя. Кого выбрать: " + names.join(", ") + "?", next);
          return;
        }
      }
      absorbFamilyBits(next, text);
      if (step === "fe-date" && !next.date) {
        ask("fe-date", personName() + ", назовите день: сегодня, завтра или дату.", next);
        return;
      }
      if (step === "fe-time" && !formatTime(next.time)) {
        ask("fe-time", personName() + ", во сколько? Например: 17:00.", next);
        return;
      }
      continueFamilyDraft(next);
    }

    function inviteRoleFromSpeech(text) {
      if (/доч/.test(text)) return "дочь";
      if (/сын/.test(text)) return "сын";
      if (/супруг/.test(text)) return "супруг(а)";
      if (/родител|мам|пап/.test(text)) return "родитель";
      if (/близк/.test(text)) return "близкий";
      return "";
    }

    function applyFamilyOnlineSpeech(text) {
      if (/код\s+приглаш|какой\s+код|назови\s+код|прочитай\s+код|скажи\s+код/.test(text)) {
        finishMessage(personName() + ", код приглашения только на экране. Вслух я его не называю.");
        return true;
      }
      if (/подключ(?:и|ить)\s+семь/.test(text)) {
        ui.section = "family";
        ui.view = "section";
        if (!familyOnlineReady()) {
          finishMessage(personName() + ", для семейной синхронизации откройте ОПОРУ по опубликованной ссылке.");
          return true;
        }
        if (familyConnected()) {
          finishMessage(personName() + ", семья уже подключена.");
          return true;
        }
        createFamilySpace(true);
        return true;
      }
      if (/приглас(?:и|ить)/.test(text)) {
        const role = inviteRoleFromSpeech(text);
        if (!role) {
          ask("fe-invite", personName() + ", кого пригласить: сына, дочь, супруга, родителя или близкого?", {});
          return true;
        }
        createFamilyInvite(role, true);
        return true;
      }
      if (/обнов(?:и|ить)\s+семейн[а-я]*\s+событ/.test(text)) {
        refreshFamilyEvents(true);
        return true;
      }
      return false;
    }

    function applyFamilyEventSpeech(text) {
      const intent = familyEventIntent(text);
      if (intent === "list") { sayFamilyEvents(text); return true; }
      if (intent === "add") { startFamilyEvent(text); return true; }
      return false;
    }

    function handleGlobal(raw) {
      const text = normCommand(raw);
      const name = personName();
      if (applyFamilyOnlineSpeech(text)) return true;
      if (applyGoalVoice(text)) return true;
      if (/какие\s+планы|планы\s+на\s+день|что\s+у\s+меня\s+сегодня|мой\s+день|что\s+сегодня|задачи\s+на\s+сегодня/.test(text)) {
        sayPlan(true);
        return true;
      }
      if (/покажи\s+задач/.test(text)) {
        sayPlan(false);
        return true;
      }
      if (applyKnownHealth(text)) return true;
      if (/добав(?:ь|ить)\s+напоминани[а-я]*\s+о\s+здоров|напомни(?:ть)?\s+о\s+здоров/.test(text)) {
        beginHealthReminder();
        return true;
      }
      if (applyDocSpeech(text)) return true;
      if (applyFamilyEventSpeech(text)) return true;
      if (applyFinanceSpeech(text)) return true;
      const money = moneyLead(text);
      if (money) {
        if (money.body) takeMoney(money.kind, money.body);
        else beginAdd(money.kind, money.kind === "income" ? "доход" : "расход");
        return true;
      }
      const docPhrase = text.match(/^(?:создай|создать|напиши|написать|сделай|сделать)\s+(?:документ[а-я]*|обращение|заявление)(?:\s+(.+))?$/);
      if (docPhrase) {
        beginAdd("document", docPhrase[1] ? "документ " + spokenRest(raw, docPhrase[1]) : "документ");
        return true;
      }
      const need = text.match(/^(?:надо|нужно)\s+(?:сделать|выполнить)(?:\s+(.+))?$/);
      const remind = text.match(/^(?:напомни|напомнить)(?:\s+мне)?(?:\s+(.+))?$/);
      if (need || remind) {
        let rest = cleanSpeech((need || remind)[1] || "");
        rest = rest.replace(/^(?:о|про|что)\s+/, "");
        if (rest) addTaskTitle(spokenRest(raw, rest));
        else ask("task-title", name + ", какую задачу записать?");
        return true;
      }
      const did = text.match(/^(?:выполнил[аи]?|сделано|сделал[аи]?|готово)(?:\s+(?:задач(?:а|у|и|ей|е)|дело|дела))?(?:\s+(.+))?$/);
      if (did) {
        if (did[1]) completeTask(did[1]);
        else ask("done-task", name + ", какую задачу отметить выполненной?");
        return true;
      }
      if (/член[а-я]*\s+сем|добав(?:ь|ить)\s+(?:в\s+)?сем|добав(?:ь|ить)\s+члена\s+сем/.test(text)) {
        beginAdd("family", "семья");
        return true;
      }
      if (/^(?:моя|мою)\s+цел/.test(text)) {
        const rest = text.replace(/^(?:моя|мою)\s+цел[а-я]*\s*/, "");
        beginAdd("goal", rest ? "цель " + rest : "цель");
        return true;
      }
      if (text === "сон") {
        ask("health-sleep", name + ", сколько вы спали? Например: 7 часов 30 минут.");
        return true;
      }
      if (text === "самочувствие") {
        ask("health-mood", name + ", какое самочувствие: отличное, хорошее, нормальное, неважное или плохое?");
        return true;
      }
      if (/^(?:удали|удалить|убери|убрать)$/.test(text)) {
        ask("delete-pick", name + ", что удалить: задачу, расход или доход?");
        return true;
      }
      const dropTask = text.match(/^(?:удали|удалить|убери|убрать)\s+(?:задач(?:а|у|и|ей|е)|дело|дела)\s+(.+)$/);
      if (dropTask) {
        confirmFoundTask(dropTask[1]);
        return true;
      }
      if (/^(?:удали|удалить|убери|убрать)\s+(?:задач(?:а|у|и|ей|е)|дело|дела)$/.test(text)) {
        ask("delete-task", name + ", какую задачу удалить?");
        return true;
      }
      const dropMoney = text.match(/^(?:удали|удалить|убери|убрать)\s+(расход(?:а|у|ом|е|ы)?|доход(?:а|у|ом|е|ы)?)(?:\s+(.+))?$/);
      const lastMoney = text.match(/^(?:удали|удалить)\s+последн(?:юю|ий)\s+(операцию|расход(?:а|у|ом|е|ы)?|доход(?:а|у|ом|е|ы)?)$/);
      if (dropMoney || lastMoney) {
        const kindWord = (dropMoney || lastMoney)[1];
        const kind = kindWord.indexOf("доход") === 0 ? "income" : (kindWord.indexOf("расход") === 0 ? "expense" : "any");
        if (dropMoney && !dropMoney[2]) {
          ask(kind === "income" ? "delete-income" : "delete-expense", kind === "income"
            ? name + ", какой доход удалить? Назовите источник."
            : name + ", какой расход удалить? Назовите категорию.");
          return true;
        }
        const op = lastMoney
          ? state.finance.ops.slice().reverse().find(function (item) {
            if (kind === "expense") return Number(item.amount) < 0;
            if (kind === "income") return Number(item.amount) > 0;
            return true;
          })
          : findMoneyBySpeech(kind, dropMoney[2]);
        if (!op) {
          finishMessage(name + ", не нашёл такую операцию.");
          return true;
        }
        const label = op.category || op.title;
        askDelete(confirmLine((Number(op.amount) < 0 ? "расход " : "доход ") + label), function () {
          removeMoney(op);
          return name + ", операция удалена. Баланс месяца: " + signedMoney(monthBalance()) + ".";
        });
        return true;
      }
      if (/^(?:добавь|добавить|создай|создать)$/.test(text)) {
        ask("add-pick", "Конечно, " + name + ". Что добавить: задачу, расход, доход, здоровье, документ, цель или семью?");
        return true;
      }
      if (/^(?:добавь|добавить|создай|создать|запиши|записать)(?:\s|$)/.test(text)) {
        const direct = matchKind(sectionTail(text));
        if (direct) {
          beginAdd(direct.kind, raw);
          return true;
        }
      }
      const only = matchKind(text);
      if (only && !only.rest) {
        beginAdd(only.kind, raw);
        return true;
      }
      const doneTask = text.match(/^(?:выполни|выполнить|заверши|завершить|отметь)\s+(?:задач(?:а|у|и|ей|е)|дело|дела)\s+(.+)$/);
      if (doneTask) {
        completeTask(doneTask[1]);
        return true;
      }
      return false;
    }

    function submitVoiceText(value) {
      const text = cleanSpeech(value);
      ui.voiceDraft = "";
      if (!text) {
        renderVoice();
        return;
      }
      haltRecognition();
      runCommand(text);
    }

    function runCommand(raw) {
      const text = normCommand(raw);
      const name = personName();
      ui.voiceHeard = cleanSpeech(raw);
      ui.commandNote = "";
      ui.voiceDraft = "";
      if (!text) {
        const quiet = vary("quiet", [
          name + ", я не расслышал. Повторите, пожалуйста.",
          name + ", пока тихо. Напишите команду ниже или скажите ещё раз."
        ]);
        ui.voiceMessage = quiet;
        pushLine("opora", quiet);
        render();
        speak(quiet);
        return;
      }
      pushLine("user", ui.voiceHeard);
      if (isRepeat(text) && (ui.dialog || ui.voiceConfirm)) {
        const question = ui.voiceConfirm ? ui.voiceConfirm.text : ui.dialog.question;
        speakThenListen(question);
        return;
      }
      if (isCancel(text) && (ui.dialog || ui.voiceConfirm)) {
        finishMessage("Хорошо, " + name + ", ничего не меняю.");
        return;
      }
      if (handleConfirm(text)) return;
      if (ui.dialog) {
        if (handleDialog(raw)) return;
        if (handleGlobal(raw)) return;
        ui.voiceMessage = "";
        pushLine("opora", ui.dialog.question);
        speakThenListen(ui.dialog.question);
        return;
      }
      if (handleGlobal(raw)) return;
      const missed = vary("missed", [
        name + ", пока не понял. Можно сказать: добавь, какие планы на день или потратил 1500 на продукты.",
        "Давайте иначе, " + name + ". Например: «добавь задачу» или «выпил стакан воды».",
        "Я рядом, " + name + ". Напишите или скажите, что сделать: задачу, расход, воду или планы на день."
      ]);
      ui.voiceMessage = missed;
      pushLine("opora", missed);
      render();
      speak(missed);
    }

    function startCommandVoice(follow) {
      const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Ctor) {
        commandListening = false;
        noteVoice(voiceUnavailableText());
        return;
      }
      const wasTitle = listening;
      if (listening) readForm();
      haltRecognition();
      if (!follow) stopSpeaking();
      ui.commandNote = "";
      ui.voiceOpen = true;
      commandListening = true;
      if (wasTitle) render();
      else renderVoice();
      const rec = new Ctor();
      recognizer = rec;
      rec.lang = "ru-RU";
      rec.interimResults = true;
      rec.continuous = false;
      rec.maxAlternatives = 1;
      let last = "";
      let finalText = "";
      let fail = "";
      rec.onresult = function (event) {
        const said = speechText(event);
        last = said.text;
        if (said.isFinal) finalText = said.text;
      };
      rec.onerror = function (event) {
        if (event.error === "aborted") return;
        fail = (event.error === "no-speech") ? "quiet" : "denied";
      };
      rec.onend = function () {
        if (recognizer !== rec) return;
        commandListening = false;
        recognizer = null;
        const said = finalText || last;
        if (said) runCommand(said);
        else if (fail === "denied") noteVoice(voiceUnavailableText());
        else {
          const who = personName();
          ui.voiceHeard = "";
          ui.voiceMessage = (who ? who + ", " : "") + "я не расслышал. Повторите, пожалуйста.";
          ui.voiceOpen = true;
          renderVoice();
          speak(ui.voiceMessage);
        }
      };
      try {
        rec.start();
      } catch (error) {
        commandListening = false;
        recognizer = null;
        noteVoice(voiceUnavailableText());
      }
    }

    function toggleVoice() {
      if (commandListening) stopVoice();
      if (listening) {
        readForm();
        stopVoice();
        render();
        return;
      }
      const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Ctor) {
        ui.voiceNote = VOICE_UNAVAILABLE;
        readForm();
        render();
        return;
      }
      readForm();
      listening = true;
      ui.voiceNote = "";
      render();
      const rec = new Ctor();
      recognizer = rec;
      rec.lang = "ru-RU";
      rec.interimResults = true;
      rec.continuous = false;
      rec.maxAlternatives = 1;
      rec.onresult = function (event) {
        let text = "";
        for (let i = 0; i < event.results.length; i += 1) text += event.results[i][0].transcript;
        text = text.replace(/\s+/g, " ").trim().slice(0, 140);
        if (ui.form) ui.form.title = text;
        const input = document.getElementById("task-title");
        if (input) input.value = text;
      };
      rec.onerror = function (event) {
        listening = false;
        recognizer = null;
        if (event.error === "not-allowed" || event.error === "service-not-allowed" || event.error === "audio-capture") {
          ui.voiceNote = VOICE_UNAVAILABLE;
        } else if (event.error !== "aborted" && event.error !== "no-speech") {
          ui.voiceNote = VOICE_UNAVAILABLE;
        }
        if (ui.view === "add") render();
      };
      rec.onend = function () {
        const was = listening;
        listening = false;
        recognizer = null;
        if (was && ui.view === "add") {
          readForm();
          render();
        }
      };
      try {
        rec.start();
      } catch (error) {
        listening = false;
        recognizer = null;
        ui.voiceNote = VOICE_UNAVAILABLE;
        render();
      }
    }

    function toggleTask(id, dateIso) {
      const task = state.tasks.find(function (item) { return item.id === id; });
      if (!task) return;
      const repeat = repeatKey(task.repeat);
      const iso = /^\d{4}-\d{2}-\d{2}$/.test(String(dateIso || "")) ? dateIso : taskCheckDate(task);
      if (!repeat) {
        task.done = !task.done;
        if (task.done) task.focus = false;
        toast(task.done ? "Дело завершено" : "Дело снова в работе");
      } else {
        if (!task.doneOn || typeof task.doneOn !== "object" || Array.isArray(task.doneOn)) task.doneOn = {};
        if (task.doneOn[iso]) {
          delete task.doneOn[iso];
          toast("Этот день снова в работе");
        } else {
          task.doneOn[iso] = true;
          if (task.focus && iso === todayIso()) task.focus = false;
          const cutoff = shiftIso(todayIso(), -400);
          Object.keys(task.doneOn).forEach(function (key) { if (key < cutoff) delete task.doneOn[key]; });
          toast("На этот день отмечено");
        }
      }
      save();
      render();
    }

    function primeAudio() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      try {
        if (!primeAudio.ctx) primeAudio.ctx = new Ctx();
        if (primeAudio.ctx.state === "suspended") primeAudio.ctx.resume();
        return primeAudio.ctx;
      } catch (error) {
        return null;
      }
    }

    function playChime() {
      const ctx = primeAudio();
      if (!ctx) return;
      const now = ctx.currentTime;
      function tone(freq, at, dur, gain) {
        const osc = ctx.createOscillator();
        const amp = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        amp.gain.setValueAtTime(0.0001, at);
        amp.gain.exponentialRampToValueAtTime(gain, at + 0.03);
        amp.gain.exponentialRampToValueAtTime(0.0001, at + dur);
        osc.connect(amp);
        amp.connect(ctx.destination);
        osc.start(at);
        osc.stop(at + dur + 0.05);
      }
      tone(523.25, now, 0.2, 0.07);
      tone(659.25, now + 0.14, 0.24, 0.06);
      tone(783.99, now + 0.28, 0.36, 0.05);
    }

    }

    function pruneReminded() {
      const keys = Object.keys(state.reminded || {});
      if (keys.length <= 80) return;
      keys.sort(function (a, b) { return Number(state.reminded[a]) - Number(state.reminded[b]); });
      keys.slice(0, keys.length - 80).forEach(function (key) { delete state.reminded[key]; });
    }

    function checkReminders() {
      if (ui.welcome || ui.locked) return;
      if (!state.reminded || typeof state.reminded !== "object" || Array.isArray(state.reminded)) state.reminded = {};
      const now = Date.now();
      const grace = 6 * 60 * 60000;
      const due = [];
      state.tasks.forEach(function (task) {
        if (!task) return;
        const dates = repeatKey(task.repeat)
          ? [shiftIso(todayIso(), -1), todayIso(), shiftIso(todayIso(), 1), shiftIso(todayIso(), 2)]
          : [task.date];
        dates.forEach(function (iso) {
          if (!taskOccursOn(task, iso) || taskDoneOn(task, iso)) return;
          const stamp = eventStamp(iso, task.time);
          if (!stamp) return;
          const keyName = leadKey(task.remind, state.remindLead || "moment");
          const fire = stamp - leadMs(keyName);
          if (now < fire || now > stamp + grace) return;
          const key = "t:" + task.id + ":" + stamp + ":" + keyName;
          if (state.reminded[key] || ui.remindQueue.some(function (item) { return item.key === key; })) return;
          due.push({ key: key, title: task.title, text: dayTitle(iso) + ", " + formatTime(task.time) });
        });
      });
      state.family.forEach(function (person) {
        const next = nextBirthday(person.born);
        if (!next) return;
        const event = new Date(next.date.getFullYear(), next.date.getMonth(), next.date.getDate(), 9, 0, 0, 0).getTime();
        const end = new Date(next.date.getFullYear(), next.date.getMonth(), next.date.getDate(), 23, 59, 0, 0).getTime();
        const keyName = leadKey(person.remind, "day");
        const fire = event - leadMs(keyName);
        if (now < fire || now > Math.max(event + grace, end)) return;
        const key = "b:" + person.id + ":" + next.date.getFullYear() + ":" + keyName;
        if (state.reminded[key] || ui.remindQueue.some(function (item) { return item.key === key; })) return;
        due.push({ key: key, title: "День рождения: " + person.name, text: birthdayPhrase(person, next.days) });
      });
      (state.familyEvents || []).forEach(function (item) {
        if (!item || item.status !== "planned") return;
        const stamp = eventStamp(item.date, item.time);
        if (!stamp) return;
        const keyName = leadKey(item.remind, "30");
        const fire = stamp - leadMs(keyName);
        if (now < fire || now > stamp + grace) return;
        const key = "fe:" + item.id + ":" + stamp + ":" + keyName;
        if (state.reminded[key] || ui.remindQueue.some(function (row) { return row.key === key; })) return;
        due.push({
          key: key,
          localOnly: true,
          title: "Пора: " + (item.title || "семейное событие"),
          text: familyPersonName(item.personId) + ", " + dayTitle(item.date) + ", " + formatTime(item.time)
        });
      });
      (state.healthReminders || []).forEach(function (item) {
        if (!item) return;
        [shiftIso(todayIso(), -1), todayIso()].forEach(function (iso) {
          if (!healthReminderOn(item, iso) || (item.doneOn && item.doneOn[iso])) return;
          const stamp = eventStamp(iso, item.time);
          if (!stamp || now < stamp || now > stamp + grace) return;
          const key = "h:" + item.id + ":" + iso;
          if (state.reminded[key] || ui.remindQueue.some(function (row) { return row.key === key; })) return;
          due.push({ key: key, healthId: item.id, date: iso, title: "Пора: " + item.title, text: formatTime(item.time) + (item.note ? ". " + item.note : "") });
        });
      });
      if (!due.length) return;
      due.forEach(function (item) {
        state.reminded[item.key] = Date.now();
        ui.remindQueue.push(item);
        if (notifyAllowed() && !item.localOnly) {
          try { new Notification("ОПОРА", { body: item.title + ". " + item.text }); } catch (error) { /* система недоступна */ }
        }
      });
      pruneReminded();
      save();
      playChime();
      renderRemind();
    }
